<title>Calculadora Cifra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Martian+Mono:wght@400;500&family=Tilt+Neon&display=swap">
<style>
/* Layout: un instrumento de una sola pantalla. Tubo de neón arriba, teclas de esmalte abajo, pestañas al alcance del pulgar. */
:root{
  --bg:#ececec; --bg2:#ffffff; --ink:#000000; --ink-dim:#5c5c5c;
  --key:#f6f6f6; --key-hi:#ffffff; --key-lo:#b4b4b4; --fn:#d6d6d6; --fn-hi:#e8e8e8;
  --op:#000000; --op-hi:#2b2b2b; --op-lo:#6e6e6e; --op-ink:#ffffff;
  --card:#f7f7f7; --line:#cacaca; --shadow:rgba(0,0,0,.2);
  --panel:#000000; --panel2:#222222; --glow:#ffffff; --glow-rgb:255,255,255;
  --on-panel:#ffffff; --on-panel-dim:#a3a3a3;
  --f-neon:"Tilt Neon","Bricolage Grotesque",system-ui,sans-serif;
  --f-ui:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Martian Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --bg2:#262626; --ink:#ffffff; --ink-dim:#a3a3a3;
  --key:#1c1c1c; --key-hi:#333333; --key-lo:#4a4a4a; --fn:#3a3a3a; --fn-hi:#505050;
  --op:#ffffff; --op-hi:#ffffff; --op-lo:#8c8c8c; --op-ink:#000000;
  --card:#121212; --line:#3d3d3d; --shadow:rgba(0,0,0,.6);
  --panel:#000000; --panel2:#262626; --glow:#ffffff; --glow-rgb:255,255,255;
  --on-panel:#ffffff; --on-panel-dim:#a3a3a3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#262626; --ink:#ffffff; --ink-dim:#a3a3a3;
  --key:#1c1c1c; --key-hi:#333333; --key-lo:#4a4a4a; --fn:#3a3a3a; --fn-hi:#505050;
  --op:#ffffff; --op-hi:#ffffff; --op-lo:#8c8c8c; --op-ink:#000000;
  --card:#121212; --line:#3d3d3d; --shadow:rgba(0,0,0,.6);
  --panel:#000000; --panel2:#262626; --glow:#ffffff; --glow-rgb:255,255,255;
  --on-panel:#ffffff; --on-panel-dim:#a3a3a3; color-scheme:dark}
/* Elección manual en Ajustes: gana siempre al tema del sistema */
:root[data-skin="negro"]{
  --bg:#000000; --bg2:#262626; --ink:#ffffff; --ink-dim:#a3a3a3;
  --key:#1c1c1c; --key-hi:#333333; --key-lo:#4a4a4a; --fn:#3a3a3a; --fn-hi:#505050;
  --op:#ffffff; --op-hi:#ffffff; --op-lo:#8c8c8c; --op-ink:#000000;
  --card:#121212; --line:#3d3d3d; --shadow:rgba(0,0,0,.6);
  --panel:#000000; --panel2:#262626; --glow:#ffffff; --glow-rgb:255,255,255;
  --on-panel:#ffffff; --on-panel-dim:#a3a3a3; color-scheme:dark}
:root[data-skin="blanco"]{
  --bg:#ececec; --bg2:#ffffff; --ink:#000000; --ink-dim:#5c5c5c;
  --key:#f6f6f6; --key-hi:#ffffff; --key-lo:#b4b4b4; --fn:#d6d6d6; --fn-hi:#e8e8e8;
  --op:#000000; --op-hi:#2b2b2b; --op-lo:#6e6e6e; --op-ink:#ffffff;
  --card:#f7f7f7; --line:#cacaca; --shadow:rgba(0,0,0,.2);
  --panel:#000000; --panel2:#222222; --glow:#ffffff; --glow-rgb:255,255,255;
  --on-panel:#ffffff; --on-panel-dim:#a3a3a3; color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;caret-color:var(--ink)}
::selection{background:var(--ink);color:var(--bg)}
:focus:not(:focus-visible){outline:none}
html,body{height:100%;overscroll-behavior:none;touch-action:pan-x pan-y}
body{margin:0;overflow:hidden;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(120% 70% at 50% -10%,var(--bg2),transparent 70%);
  font-family:var(--f-ui);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--op);outline-offset:2px}
.app{width:100%;max-width:470px;height:100%;max-height:920px;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;position:relative}

/* cabecera */
.top{display:flex;align-items:center;gap:6px;flex:none}
.brand{font-family:var(--f-neon);font-size:24px;color:var(--op);letter-spacing:.01em;margin-right:auto}
.ico{width:38px;height:38px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink-dim)}
.ico:hover{background:var(--fn)}
.ico svg,.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* vistas */
.view{flex:1 1 0;min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.scroll{overflow-y:auto;overscroll-behavior:contain;padding-bottom:12px;gap:12px;scrollbar-width:thin}

/* pantalla de tubo */
.screen{flex:1 1 0;min-height:128px;position:relative;overflow:hidden;border-radius:22px;
  background:radial-gradient(90% 90% at 80% 100%,var(--panel2),var(--panel) 70%);
  box-shadow:inset 0 2px 10px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.12);
  display:flex;flex-direction:column;justify-content:flex-end;padding:10px 16px 12px;color:var(--on-panel);touch-action:pan-y}
.screen::after{content:"";position:absolute;inset:-40% -60%;pointer-events:none;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.05) 49%,rgba(255,255,255,.012) 54%,transparent 60%);
  animation:glare 11s ease-in-out infinite alternate}
@keyframes glare{from{transform:translateX(-14%)}to{transform:translateX(14%)}}
.screen>*{position:relative;z-index:1}
.status{position:absolute;top:10px;left:14px;right:14px;display:flex;gap:6px;align-items:center;z-index:2;font-family:var(--f-data);font-size:10px}
.chip{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:var(--on-panel-dim);border-radius:99px;padding:4px 9px;letter-spacing:.06em;font:inherit}
button.chip:hover{color:var(--on-panel)}
.chip.on{color:var(--glow);border-color:rgba(var(--glow-rgb),.5)}
.status .sp{margin-left:auto}
.expr{white-space:nowrap;overflow-x:auto;scrollbar-width:none;text-align:right;font-family:var(--f-neon);line-height:1.2;color:var(--glow);
  text-shadow:0 0 6px rgba(var(--glow-rgb),.8),0 0 22px rgba(var(--glow-rgb),.45);padding-block:2px;min-height:1.3em;transition:color .18s}
.expr::-webkit-scrollbar{display:none}
.done .expr{color:var(--on-panel-dim);text-shadow:none}
.expr .sep{opacity:.65}
.caret{display:inline-block;width:2px;height:.95em;margin-inline:1px;background:var(--glow);vertical-align:-.12em;box-shadow:0 0 8px var(--glow);animation:blink 1.05s steps(2) infinite}
.done .caret{display:none}
@keyframes blink{50%{opacity:0}}
.result{font-family:var(--f-neon);text-align:right;white-space:nowrap;overflow:hidden;line-height:1.14;color:var(--on-panel-dim);min-height:1.2em;font-size:20px;cursor:copy;background:none;border:0;padding:0;width:100%}
.done .result{color:var(--glow);filter:drop-shadow(0 0 5px rgba(var(--glow-rgb),.85)) drop-shadow(0 0 20px rgba(var(--glow-rgb),.42))}
.result.err{color:var(--on-panel);font-family:var(--f-ui);font-size:15px;filter:none}
.od{display:inline-block;width:.6em;height:1.14em;overflow:hidden;vertical-align:bottom}
.od-col{display:block;transform:translateY(calc(var(--n)*-1.14em));transition:transform calc(.42s + var(--i)*34ms) cubic-bezier(.16,1.1,.3,1)}
.od-col b{display:block;height:1.14em;font-weight:400;text-align:center}
.ch{display:inline-block}
.screen.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.screen.boot .expr,.screen.boot .result{animation:boot .9s linear both}
@keyframes boot{0%{opacity:.35}12%{opacity:1}18%{opacity:.5}34%{opacity:1}42%{opacity:.75}100%{opacity:1}}

/* teclas */
.k{border:0;min-width:0;border-radius:17px;font-family:var(--f-ui);font-weight:500;font-size:clamp(21px,5.6vw,26px);
  color:var(--ink);background:linear-gradient(180deg,var(--key-hi),var(--key) 70%);
  box-shadow:0 4px 0 var(--key-lo),0 7px 12px var(--shadow),inset 0 1px 0 rgba(255,255,255,.14);
  transition:transform .07s ease-out,box-shadow .07s ease-out;touch-action:manipulation;user-select:none;-webkit-user-select:none;margin-bottom:4px}
.k:active,.k.down{transform:translateY(3px);box-shadow:0 1px 0 var(--key-lo),0 2px 4px var(--shadow),inset 0 1px 0 rgba(255,255,255,.14)}
.k.fn{background:linear-gradient(180deg,var(--fn-hi),var(--fn) 70%);font-size:clamp(17px,4.6vw,21px)}
.k.op{background:linear-gradient(180deg,var(--op-hi),var(--op) 70%);color:var(--op-ink);box-shadow:0 4px 0 var(--op-lo),0 7px 12px var(--shadow),inset 0 1px 0 rgba(255,255,255,.25);font-size:clamp(24px,6.4vw,30px)}
.k.op:active,.k.op.down{box-shadow:0 1px 0 var(--op-lo),0 2px 4px var(--shadow)}
.k.small{font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--key-lo),inset 0 1px 0 rgba(255,255,255,.12);margin-bottom:3px;padding:0}
.k.small.fn{font-size:14px}
.k.small:active,.k.small.down{transform:translateY(2px);box-shadow:0 1px 0 var(--key-lo)}
.k.armed{background:linear-gradient(180deg,var(--op-hi),var(--op));color:var(--op-ink)}
.strip{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;height:38px}
.sci{flex:none;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:37px;gap:6px}
.keypad{flex:1.75 1 0;min-height:236px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:7px}

/* pestañas */
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--card);border-radius:18px;padding:4px;box-shadow:0 0 0 1px var(--line)}
.tab{border:0;background:transparent;border-radius:14px;color:var(--ink-dim);padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500}
.tab[aria-selected="true"]{color:var(--op-ink);background:var(--op)}

/* herramientas */
.chips{display:flex;gap:6px;overflow-x:auto;flex:none;scrollbar-width:none;padding-block:1px}
.chips::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink-dim);padding:7px 13px;border-radius:99px;font-size:14px;font-weight:500}
.pill[aria-pressed="true"]{background:var(--op);border-color:var(--op);color:var(--op-ink)}
.hero{flex:none;border-radius:20px;padding:14px 16px;background:radial-gradient(90% 120% at 90% 100%,var(--panel2),var(--panel) 75%);color:var(--on-panel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.hero small{display:block;color:var(--on-panel-dim);font-size:13px}
.hero .big{font-family:var(--f-neon);font-size:clamp(30px,10vw,42px);line-height:1.15;color:var(--glow);text-shadow:0 0 6px rgba(var(--glow-rgb),.75),0 0 22px rgba(var(--glow-rgb),.4);overflow-wrap:anywhere}
.hero .sub{color:var(--on-panel-dim);font-size:13px;font-family:var(--f-data)}
.card{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field label,.flabel{font-size:12.5px;color:var(--ink-dim);font-weight:500}
.inp{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:12px;padding:0 11px;box-shadow:inset 0 0 0 1px var(--line)}
.inp:focus-within{box-shadow:inset 0 0 0 2px var(--op)}
.inp input,.inp select{flex:1;min-width:0;width:100%;height:42px;border:0;background:transparent;outline:0;font-size:16px;font-family:var(--f-data);font-variant-numeric:tabular-nums}
.inp select{font-family:var(--f-ui)}
.inp span{color:var(--ink-dim);font-size:12.5px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;height:36px;font-weight:500;color:var(--ink-dim);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--op);color:var(--op-ink)}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.row b{font-family:var(--f-data);font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.note{font-size:13px;line-height:1.4;color:var(--ink-dim);margin:0}
.warn{font-size:13.5px;line-height:1.4;color:var(--ink);margin:0;font-weight:700}
.swap{align-self:center;width:42px;height:42px;border-radius:50%;border:0;background:var(--op);color:var(--op-ink);display:grid;place-items:center;margin-block:-4px;z-index:2;box-shadow:0 3px 8px var(--shadow);transition:transform .3s}
.swap svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ladder{position:relative;height:74px;margin-inline:4px}
.ladder .bar{position:absolute;top:33px;height:8px;border-radius:2px}
.ladder .base{left:0;right:0;background:var(--line)}
.ladder .lo{background:var(--ink-dim)} .ladder .hi{background:var(--ink)}
.ladder .tick{position:absolute;top:27px;width:2px;height:20px;background:var(--ink);transform:translateX(-1px)}
.ladder .lb{position:absolute;font-family:var(--f-data);font-size:10.5px;line-height:1.3;white-space:nowrap;color:var(--ink-dim);transform:translateX(var(--tx,-50%))}
.ladder .lb.up{top:0}.ladder .lb.dn{bottom:0}
.bars{display:flex;align-items:flex-end;gap:2px;height:130px}
.bars i{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.bars i u{display:block;background:var(--op)}
.bars i s{display:block;background:var(--ink-dim);opacity:.55}
.axis{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:10.5px;color:var(--ink-dim)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* hojas */
.scrim{position:absolute;inset:0;background:rgba(5,15,20,.5);z-index:20;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:82%;z-index:21;background:var(--bg);border-radius:24px;box-shadow:0 0 0 1px var(--line),0 -10px 40px var(--shadow);display:flex;flex-direction:column;animation:rise .26s cubic-bezier(.2,1,.3,1)}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.sheet h2{margin:0;font-size:19px;font-weight:600;margin-right:auto}
.sheet .body{overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.textbtn{border:0;background:transparent;color:var(--op);font-weight:600;font-size:14px;padding:6px}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);background:transparent;border-inline:0;border-top:0;text-align:left;width:100%}
.hrow .e{font-family:var(--f-data);font-size:12px;color:var(--ink-dim);overflow-wrap:anywhere;min-width:0}
.hrow .v{grid-column:1;font-family:var(--f-neon);font-size:22px;color:var(--ink);overflow-wrap:anywhere}
.hrow em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:11px;color:var(--ink-dim);border:1px solid var(--line);padding:2px 7px;border-radius:99px}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{border:0;border-radius:14px;padding:10px 6px;font-size:13px;font-weight:500;background:var(--card);box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;gap:6px}
.skin[aria-pressed="true"]{box-shadow:0 0 0 2px var(--op)}
.skin i{width:42px;height:22px;border-radius:7px;background:var(--s1);box-shadow:inset -14px 0 0 var(--s2)}
.switch{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:6px 0;border:0;background:transparent;width:100%;text-align:left}
.switch i{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--key-hi);box-shadow:0 1px 2px var(--shadow);transition:transform .15s}
.switch[aria-pressed="true"] i{background:var(--op)}
.switch[aria-pressed="true"] i::after{transform:translateX(18px)}
.toast{position:absolute;left:50%;top:52px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:99px;font-size:13.5px;font-weight:500;animation:fade .15s;white-space:nowrap}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (max-height:640px){.keypad{min-height:205px;gap:6px}.screen{min-height:100px}.sci{grid-auto-rows:32px;gap:5px}.strip{height:33px}.tab svg{display:none}.tab{padding:9px 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <div class="top">
    <div class="brand">Cifra</div>
    <button class="ico" id="btnHist" aria-label="Historial"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3.5 2"/></svg></button>
    <button class="ico" id="btnSet" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/></svg></button>
  </div>

  <section class="view" id="v-calc">
    <div class="screen boot" id="screen">
      <div class="status">
        <button class="chip on" id="deg" aria-label="Cambiar entre grados y radianes">DEG</button>
        <span class="chip" id="memChip" hidden></span>
        <span class="chip sp" id="hint">Desliza para borrar</span>
      </div>
      <div class="expr" id="expr" aria-live="polite"></div>
      <button class="result" id="res" aria-label="Resultado. Toca para copiar"></button>
    </div>
    <div class="strip" id="strip"></div>
    <div class="sci" id="sci" hidden></div>
    <div class="keypad" id="keypad"></div>
  </section>

  <section class="view scroll" id="v-conv" hidden>
    <div class="chips" id="convChips"></div>
    <div class="hero"><small id="cTo">Equivale a</small><div class="big" id="cOut">—</div><div class="sub" id="cRate"></div></div>
    <div class="card">
      <div class="grid2">
        <div class="field wide"><label for="cAmt">Cantidad</label><div class="inp"><input id="cAmt" inputmode="text" autocomplete="off" value="100"></div></div>
        <div class="field"><label for="cFrom">De</label><div class="inp"><select id="cFrom"></select></div></div>
        <div class="field"><label for="cDest">A</label><div class="inp"><select id="cDest"></select></div></div>
      </div>
      <button class="swap" id="cSwap" aria-label="Intercambiar unidades"><svg viewBox="0 0 24 24"><path d="M7 4v15M7 19l-3-3M7 19l3-3M17 20V5M17 5l-3 3M17 5l3 3"/></svg></button>
      <div class="field" id="cOwn" hidden><label for="cMine">Mi tipo de cambio (opcional)</label><div class="inp"><input id="cMine" inputmode="text" autocomplete="off" placeholder="Automático"></div></div>
    </div>
    <div class="card"><div class="flabel" id="cAllT">Todas</div><div class="rows" id="cAll"></div></div>
  </section>

  <section class="view scroll" id="v-trade" hidden></section>
  <section class="view scroll" id="v-fin" hidden></section>

  <nav class="tabs" id="tabs" role="tablist"></nav>

    if (!(dist > 0)) return { error: `En un ${v.side} el stop tiene que estar ${long ? 'por debajo' : 'por encima'} de la entrada.` };
    const up = long ? v.target - v.entry : v.entry - v.target;
    if (!(up > 0)) return { error: `En un ${v.side} el objetivo tiene que estar ${long ? 'por encima' : 'por debajo'} de la entrada.` };
    const riskAmt = v.cap * v.risk / 100, qty = riskAmt / (dist + f * (v.entry + v.stop)), notional = qty * v.entry, margin = notional / v.lev;
    const net = qty * up - qty * f * (v.entry + v.target), rr = net / riskAmt;
    const be = long ? v.entry * (1 + f) / (1 - f) : v.entry * (1 - f) / (1 + f), liq = long ? v.entry * (1 - 1 / v.lev) : v.entry * (1 + 1 / v.lev);
    const warn = [];
    if (margin > v.cap) warn.push(`Te faltan ${n2(margin - v.cap)} de margen. Sube el apalancamiento o baja el riesgo.`);
    if (long ? v.stop <= liq : v.stop >= liq) warn.push('La liquidación llegaría antes que el stop. Baja el apalancamiento.');
    const pts = [['Stop', v.stop], ['Entrada', v.entry], ['Objetivo', v.target]];
    if (Math.abs(liq - v.entry) <= 3 * Math.max(dist, up)) pts.push(['Liq.', liq]);
    const lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1])), pos = p => (p - lo) / (hi - lo) * 100;
    const seg = (a, b, c) => `<div class="bar ${c}" style="left:${Math.min(pos(a), pos(b))}%;width:${Math.abs(pos(a) - pos(b))}%"></div>`;
    const mark = ([l, p], i) => { const x = pos(p), tx = x < 14 ? '0' : x > 86 ? '-100%' : '-50%'; const up2 = l === 'Entrada' || l === 'Liq.'; return `<div class="tick" style="left:${x}%"></div><div class="lb ${up2 ? 'up' : 'dn'}" style="left:${x}%;--tx:${tx}">${l}<br>${nz(p, 2)}</div>`; };
    return {
      hero: ['Tamaño de la posición', `${nz(qty, 5)} uds.`, `Nominal ${n2(notional)} · Margen ${n2(margin)}`],
      warn,
      extra: `<div class="ladder"><div class="bar base"></div>${seg(v.stop, v.entry, 'lo')}${seg(v.entry, v.target, 'hi')}${pts.map(mark).join('')}</div>`,
      rows: [['Pierdes en el stop', '−' + n2(riskAmt), 'r'], ['Ganas en el objetivo', '+' + n2(net), 'g'], ['Riesgo/beneficio', '1 : ' + n2(rr)], ['Precio sin pérdida', nz(be, 2)], ['Liquidación aproximada', nz(liq, 2)]],
      note: 'La pérdida y la ganancia ya incluyen comisiones de entrada y salida. La liquidación real depende del exchange.',
    };
  },
}, {
  id: 'exp', name: 'Expectativa',
  fields: [{ id: 'win', l: 'Acierto', v: '42', u: '%' }, { id: 'r', l: 'Ganancia media', v: '2,2', u: 'R' }, { id: 'n', l: 'Operaciones al mes', v: '40' }, { id: 'risk', l: 'Riesgo por operación', v: '1', u: '%' }],
  calc(v) {
    const w = v.win / 100, e = w * v.r - (1 - w), mo = Math.pow(1 + e * v.risk / 100, v.n) - 1, be = 1 / (1 + v.r), streak = Math.log(100) / -Math.log(1 - w);
    return {
      hero: ['Expectativa por operación', `${e >= 0 ? '+' : '−'}${n2(Math.abs(e))} R`, e >= 0 ? 'El sistema gana a largo plazo' : 'Con estos datos el sistema pierde'],
      rows: [['Acierto mínimo para no perder', n2(be * 100, 1) + ' %'], ['Resultado mensual estimado', (mo >= 0 ? '+' : '−') + n2(Math.abs(mo) * 100, 1) + ' %', mo >= 0 ? 'g' : 'r'], ['Racha perdedora en 100 operaciones', '≈ ' + Math.round(streak) + ' seguidas']],
      note: 'Es una estimación con tus medias. No incluye comisiones ni deslizamiento.',
    };
  },
}, {
  id: 'dd', name: 'Recuperar',
  fields: [{ id: 'cap', l: 'Capital antes de perder', v: '5000' }, { id: 'loss', l: 'Pérdida', v: '20', u: '%' }],
  calc(v) {
    if (v.loss >= 100) return { error: 'La pérdida tiene que ser menor del 100 %.' };
    const l = v.loss / 100, g = l / (1 - l);
    return { hero: ['Para volver a cero necesitas', `+${n2(g * 100, 1)} %`, `Te quedan ${n2(v.cap * (1 - l))}`], rows: [10, 20, 30, 50, 75].map(p => [`Pierdes ${p} %`, `+${n2(p / (100 - p) * 100, 1)} %`]) };
  },
});
TOOLS.fin.push({
  id: 'iva', name: 'IVA',
  fields: [{ id: 'mode', seg: ['Añadir IVA', 'Quitar IVA'], wide: 1 }, { id: 'tipo', seg: ['21 %', '10 %', '4 %'], wide: 1, d: '10 %' }, { id: 'amt', l: 'Importe', v: '100', u: '€', wide: 1 }],
  calc(v) {
    const r = parseFloat(v.tipo) / 100, add = v.mode === 'Añadir IVA', base = add ? v.amt : v.amt / (1 + r), total = add ? v.amt * (1 + r) : v.amt;
    return { hero: [add ? 'Total con IVA' : 'Base sin IVA', n2(add ? total : base) + ' €', `IVA ${v.tipo}: ${n2(total - base)} €`], rows: [['Base', n2(base) + ' €'], ['Cuota de IVA', n2(total - base) + ' €'], ['Total', n2(total) + ' €']] };
  },
}, {
  id: 'mar', name: 'Margen',
  fields: [{ id: 'cost', l: 'Coste', v: '4,20', u: '€' }, { id: 'm', l: 'Margen deseado', v: '70', u: '%' }, { id: 'tipo', seg: ['21 %', '10 %', '4 %'], wide: 1, d: '10 %' }],
  calc(v) {
    if (v.m >= 100) return { error: 'El margen tiene que ser menor del 100 %.' };
    const r = parseFloat(v.tipo) / 100, pvp = v.cost / (1 - v.m / 100), iva = pvp * (1 + r);
    return { hero: ['Precio de venta con IVA', n2(iva) + ' €', `Sin IVA ${n2(pvp)} €`], rows: [['Beneficio por unidad', n2(pvp - v.cost) + ' €', 'g'], ['Coste sobre venta', n2(v.cost / pvp * 100, 1) + ' %'], ['Multiplicador sobre coste', '× ' + n2(pvp / v.cost)]] };
  },
}, {
  id: 'cta', name: 'Dividir cuenta',
  fields: [{ id: 'total', l: 'Total', v: '86,40', u: '€' }, { id: 'p', l: 'Personas', v: '4' }, { id: 'tip', l: 'Propina', v: '10', u: '%', wide: 1 }],
  calc(v) {
    if (!(v.p >= 1)) return { error: 'Indica al menos una persona.' };
    const t = v.total * (1 + v.tip / 100), each = Math.ceil(t / v.p * 100) / 100;
    return { hero: ['Paga cada persona', n2(each) + ' €', `Total con propina ${n2(t)} €`], rows: [['Propina', n2(t - v.total) + ' €'], ['Redondeando a 0,50 €', n2(Math.ceil(t / v.p * 2) / 2) + ' €']] };
  },
}, {
  id: 'pre', name: 'Préstamo',
  fields: [{ id: 'cap', l: 'Importe', v: '30000', u: '€', wide: 1 }, { id: 'tin', l: 'Interés anual (TIN)', v: '6,5', u: '%' }, { id: 'y', l: 'Plazo', v: '7', u: 'años' }],
  calc(v) {
    const r = v.tin / 1200, n = Math.round(v.y * 12); if (!(n > 0)) return { error: 'Indica un plazo.' };
    const q = r ? v.cap * r / (1 - Math.pow(1 + r, -n)) : v.cap / n, tot = q * n;
    return { hero: ['Cuota mensual', n2(q) + ' €', `${n} cuotas`], rows: [['Total a pagar', n2(tot) + ' €'], ['Intereses', n2(tot - v.cap) + ' €', 'r'], ['Intereses sobre el importe', n2((tot - v.cap) / v.cap * 100, 1) + ' %']], note: 'Sistema francés con cuota fija. No incluye comisiones ni seguros.' };
  },
}, {
  id: 'com', name: 'Interés compuesto',
  fields: [{ id: 'ini', l: 'Inicial', v: '5000', u: '€' }, { id: 'men', l: 'Aporte mensual', v: '300', u: '€' }, { id: 'tasa', l: 'Rentabilidad anual', v: '8', u: '%' }, { id: 'y', l: 'Años', v: '15' }],
  calc(v) {
    const yrs = Math.min(60, Math.round(v.y)); if (!(yrs > 0)) return { error: 'Indica cuántos años.' };
    const m = v.tasa / 1200; let bal = v.ini; const data = [];
    for (let y = 1; y <= yrs; y++) { for (let i = 0; i < 12; i++) bal = bal * (1 + m) + v.men; data.push([bal, v.ini + v.men * 12 * y]); }
    const apo = data.at(-1)[1], top = data.at(-1)[0] > 0 ? Math.max(...data.map(d => d[0])) : 1;
    const bars = data.map(([b, a]) => { const c = Math.min(a, b); return `<i><u style="height:${Math.max(0, b - c) / top * 100}%"></u><s style="height:${c / top * 100}%"></s></i>`; }).join('');
    return {
      hero: [`Tendrás en ${yrs} años`, n2(bal, 0) + ' €', `Aportas ${n2(apo, 0)} € · Intereses ${n2(bal - apo, 0)} €`],
      extra: `<div class="legend"><span><i style="background:var(--op)"></i>Intereses</span><span><i style="background:var(--ink-dim)"></i>Aportado</span></div><div class="bars" role="img" aria-label="Evolución del capital por años">${bars}</div><div class="axis"><span>Año 1</span><span>Año ${yrs}: ${n2(bal, 0)} €</span></div>`,
      rows: [],
    };
  },
});
const saved = store.get('tools', {});
function buildTools(hostId, key) {
  const host = $(hostId), list = TOOLS[key]; let cur = list[0];
  host.innerHTML = `<div class="chips">${list.map(t => `<button class="pill" data-t="${t.id}">${t.name}</button>`).join('')}</div><div class="hero" data-h></div><div class="card" data-f></div><div class="card" data-o></div>`;
  const form = host.querySelector('[data-f]'), out = host.querySelector('[data-o]'), hero = host.querySelector('[data-h]');
  const state = {};
  const val = (t, f) => saved[t.id + '.' + f.id] ?? (f.seg ? (f.d || f.seg[0]) : f.v);
  function show() {
    host.querySelectorAll('.pill').forEach(p => p.setAttribute('aria-pressed', p.dataset.t === cur.id));
    const t = cur;
    form.innerHTML = '<div class="grid2">' + t.fields.map(f => {
      const id = `${t.id}-${f.id}`;
      if (f.seg) { state[f.id] = val(t, f); return `<div class="field wide"><div class="seg" data-seg="${f.id}">${f.seg.map(o => `<button aria-pressed="${o === state[f.id]}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`; }
      return `<div class="field ${f.wide ? 'wide' : ''}"><label for="${id}">${f.l}</label><div class="inp"><input id="${id}" data-fid="${f.id}" inputmode="text" autocomplete="off" value="${esc(val(t, f))}">${f.u ? `<span>${f.u}</span>` : ''}</div></div>`;
    }).join('') + '</div>';
    run();
  }
  function run() {
    const t = cur, v = {}; let bad = null;
    for (const f of t.fields) {
      if (f.seg) { v[f.id] = state[f.id]; continue; }
      const el = form.querySelector(`[data-fid="${f.id}"]`), x = numIn(el.value);
      if (!Number.isFinite(x)) bad = f.l; v[f.id] = x;
    }
    if (bad) { hero.innerHTML = `<small>Falta un dato</small><div class="big">—</div><div class="sub">Revisa: ${esc(bad)}</div>`; out.hidden = true; return; }
    const r = t.calc(v);
    if (r.error) { hero.innerHTML = `<small>Revisa los datos</small><div class="big">—</div>`; out.hidden = false; out.innerHTML = `<p class="warn">${esc(r.error)}</p>`; return; }
    hero.innerHTML = `<small>${esc(r.hero[0])}</small><div class="big">${esc(r.hero[1])}</div><div class="sub">${esc(r.hero[2])}</div>`;
    out.hidden = false;
    out.innerHTML = (r.warn || []).map(w => `<p class="warn">${esc(w)}</p>`).join('') + (r.extra || '') +
      (r.rows.length ? '<div class="rows">' + r.rows.map(x => `<div class="row"><span>${esc(x[0])}</span><b class="${x[2] || ''}">${esc(x[1])}</b></div>`).join('') + '</div>' : '') +
      (r.note ? `<p class="note">${esc(r.note)}</p>` : '');
  }
  host.addEventListener('click', e => {
    const p = e.target.closest('.pill'); if (p) { cur = list.find(t => t.id === p.dataset.t); show(); return; }
    const o = e.target.closest('[data-o]'); const sg = e.target.closest('[data-seg]');
    if (o && sg) { state[sg.dataset.seg] = o.dataset.o; saved[cur.id + '.' + sg.dataset.seg] = o.dataset.o; store.set('tools', saved); sg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === o)); run(); }
  });
  host.addEventListener('input', e => { const f = e.target.dataset.fid; if (f) { saved[cur.id + '.' + f] = e.target.value; store.set('tools', saved); run(); } });
  show();
}
