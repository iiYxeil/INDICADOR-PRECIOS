<script>
/* Pone tus colores antes de pintar nada, para que no parpadee */
try {
  var s = JSON.parse(localStorage.getItem('mis-finanzas-v1') || '{}').perfil || {};
  if (s.paleta) document.documentElement.setAttribute('data-paleta', s.paleta);
  if (s.tema === 'claro' || s.tema === 'oscuro') document.documentElement.setAttribute('data-tema', s.tema);
} catch (e) {}
</script>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Comportamiento de app: nada se selecciona ni abre menus de web al mantener pulsado */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:default;overscroll-behavior:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
a,svg,canvas{-webkit-user-drag:none;-webkit-touch-callout:none}
#vista:focus{outline:0}
#arranque{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .32s ease,visibility .32s}
#arranque.fuera{opacity:0;visibility:hidden}
#arranque i{display:block;width:84px;height:84px;border-radius:21px;background:var(--grad);box-shadow:0 18px 44px -14px var(--glow);animation:ar .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes ar{from{opacity:0;transform:scale(.8)}}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;
     -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select{border-radius:0}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.din{transition:filter .25s ease;font-variant-numeric:tabular-nums}
body.oculto .din{filter:blur(9px)}
.ok{color:var(--ok)} .mal{color:var(--mal)} .am{color:var(--ambar)} .sutil{color:var(--muted)}
.ic{display:inline-block;flex:none;width:1.25em;height:1.25em;vertical-align:-.27em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;
     padding-bottom:calc(112px + var(--seg-b));position:relative}
#vista{outline:0}
.vista-in{animation:vista .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes vista{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.desliza-i{animation:desi .34s cubic-bezier(.2,.8,.2,1) both}
.desliza-d{animation:desd .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes desi{from{opacity:.2;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes desd{from{opacity:.2;transform:translateX(26px)}to{opacity:1;transform:none}}

/* ---------- fondo continuo: degradados que se funden, sin bordes ---------- */
.fondo{position:fixed;left:0;right:0;top:0;height:min(82vh,680px);z-index:0;overflow:hidden;pointer-events:none;transform:translateY(calc(var(--sc,0)*-.22px));
  -webkit-mask-image:linear-gradient(180deg,#000 35%,transparent);mask-image:linear-gradient(180deg,#000 35%,transparent)}
.fondo i{position:absolute;display:block;aspect-ratio:1;border-radius:50%;will-change:transform}
.fondo i:nth-child(1){width:125%;left:-38%;top:-42%;background:radial-gradient(closest-side,var(--f1),transparent);animation:d1 16s ease-in-out infinite alternate}
.fondo i:nth-child(2){width:115%;right:-42%;top:-30%;background:radial-gradient(closest-side,var(--f2),transparent);animation:d2 21s ease-in-out infinite alternate}
.fondo i:nth-child(3){width:90%;left:12%;top:16%;background:radial-gradient(closest-side,var(--f3),transparent);animation:d3 25s ease-in-out infinite alternate}
.polvo{position:absolute;inset:0;width:100%;height:100%}
:root[data-tema="claro"] .polvo{display:none}
#app{z-index:1;position:relative}
.cab{position:relative;padding:calc(var(--seg-t) + 14px) 18px 0;touch-action:pan-y}
.aurora{position:absolute;inset:-30% -20%;z-index:-1;pointer-events:none}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(38px);will-change:transform}
.aurora i:nth-child(1){width:64%;aspect-ratio:1;left:-8%;top:8%;background:var(--a1);opacity:.85;animation:d1 13s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:60%;aspect-ratio:1;right:-6%;top:-4%;background:var(--a2);opacity:.8;animation:d2 16s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:48%;aspect-ratio:1;left:32%;bottom:2%;background:var(--a3);opacity:.34;animation:d3 19s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(32%,18%) scale(1.15)}}
@keyframes d2{to{transform:translate(-34%,26%) scale(.9)}}
@keyframes d3{to{transform:translate(-42%,-30%) scale(1.25)}}
.cab-top{display:flex;align-items:center;gap:8px;margin-bottom:15px}
.cab-tit{flex:1;min-width:0}
.cab-tit h1{font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.cab-tit p{font-size:13.5px;font-weight:500;line-height:1.25;color:var(--ink2);margin-top:2px}
.redondo{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--vidrio);box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s ease}
.redondo:active{transform:scale(.88)}
.redondo .ic{font-size:16px}
.meses{display:flex;align-items:center;gap:6px;margin:0 -18px}
.meses.en-cab{padding-right:18px}
.m-tira{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;padding:3px 18px;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent)}
.m-tira::-webkit-scrollbar{display:none}
.m-chip{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 11px;border-radius:12px;font-size:14.5px;font-weight:600;color:var(--muted);transition:transform .18s cubic-bezier(.2,1.5,.4,1)}
.m-chip:active{transform:scale(.93)}
.m-chip b{font-weight:inherit;line-height:1}
.m-bar{display:none}
.m-chip.hoy:not(.sel){color:var(--ink)}
.m-chip.sel{padding:0 14px;font-size:15px;font-weight:800;color:var(--sobre-ac);background:var(--ac)}
.m-chip.sel small{font-size:12.5px;font-weight:700;opacity:.65}
.m-todo{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:14.5px;color:var(--ink2);background:var(--vidrio)}
.meses.pegado{position:sticky;top:0;z-index:20;margin:0;padding:calc(var(--seg-t) + 7px) 14px 7px 0;background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.meses.pegado .m-tira{padding-left:14px;padding-right:14px}
.ms-cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.ms-cab h2{margin:0}
.ms-cab button{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:15px;background:var(--card2);color:var(--ink)}
.ms-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ms-c{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 12px 11px;border-radius:16px;text-align:left;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.ms-c b{font-size:15.5px;font-weight:800}
.ms-c small{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.ms-c.fut{opacity:.55}
.ms-c.hoy b{color:var(--ac)}
.ms-c[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ac);background:var(--ac-s)}
.bal-z{margin-top:16px}
.bal-z.late{animation:late .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes late{40%{scale:1.04}}
.bal-et{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;color:var(--ink2)}
.ojo{display:grid;place-items:center;width:32px;height:32px;margin:-6px 0;border-radius:50%;font-size:13px;color:var(--muted)}
.ojo:active{background:var(--vidrio)}
.bal{font-size:clamp(46px,14.6vw,62px);font-weight:800;letter-spacing:-.045em;line-height:1.12;white-space:nowrap;display:flex;margin-top:2px}
.rod{display:inline-block;height:1.12em;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(180deg,transparent,#000 10%,#000 90%,transparent)}
.rod b{display:block;font-weight:800;transition:transform 1.05s cubic-bezier(.16,1,.3,1);will-change:transform}
.rod b i{display:block;height:1.12em;font-style:normal}
.sig{display:inline-block}
.delta{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;margin-top:3px;font-size:14px;font-weight:600}
.delta .ic{font-size:12px;stroke-width:2.6}
.d-menos{color:var(--ok)}.d-mas{color:var(--mal)}
.graf{margin:12px -18px 0}
.graf-cab{display:flex;justify-content:flex-end;padding:0 18px 4px}
.seg.peq{display:inline-grid;min-width:148px;padding:3px;border-radius:12px;background:var(--vidrio);box-shadow:none}
.seg.peq::before{top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n,2));border-radius:9px}
.seg.peq button{height:30px;font-size:13px;border-radius:9px}
.spark{position:relative;height:236px;touch-action:pan-y;cursor:crosshair}
.spark svg{display:block;width:100%;height:100%;overflow:visible}
.sp-l{filter:drop-shadow(0 4px 10px var(--glow))}
.anim .sp-traza{animation:traza 1.25s cubic-bezier(.3,.7,.2,1) both}
@keyframes traza{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% 0 -20% 0)}}
.y-et{position:absolute;right:10px;transform:translateY(-50%);font-size:11.5px;font-weight:600;color:var(--muted);pointer-events:none;white-space:nowrap}
.sp-p,.sp-c{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 3px var(--bg),0 0 14px 3px var(--glow);pointer-events:none}
.sp-p::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ac);animation:latido 2.4s ease-out infinite}
@keyframes latido{to{transform:scale(3.2);opacity:0}}
.sp-c{opacity:0}
.sp-e{position:absolute;top:-8px;transform:translateX(-50%);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink);background:var(--card3);opacity:0;pointer-events:none;box-shadow:0 8px 18px -8px rgba(0,0,0,.55)}
.graf-x{position:relative;height:18px;font-size:11.5px;font-weight:600;color:var(--muted)}
.graf-x span{position:absolute;transform:translateX(-50%)}
.graf-ley{margin:6px 18px 0}
.graf-nota{display:flex;align-items:center;gap:9px;margin:8px 18px 0;font-size:12.5px;font-weight:600;line-height:1.35;color:var(--ink2)}
.graf-nota i{flex:none;width:20px;border-top:2.5px dotted var(--ac)}
.graf-vacio{display:flex;align-items:center;gap:12px;margin:8px 18px 0;padding:22px 16px;border-radius:18px;font-size:14.5px;line-height:1.4;color:var(--ink2);background:var(--vidrio)}
.graf-vacio .ic{font-size:18px;color:var(--ac)}
.panel{border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sombra);overflow:hidden}
.gemelas{display:grid;grid-template-columns:1.12fr 1.12fr .76fr}
.gema{display:block;padding:13px 13px 12px;min-width:0;text-align:left}
.gema + .gema{box-shadow:inset 1px 0 0 var(--line)}
.gema:active{background:var(--vidrio)}
.gema small{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2);line-height:1.2}
.gema small i{display:grid;font-size:10.5px}
.sube-i{color:var(--ok)}.baja-i{color:var(--mal)}.aho-i{color:var(--ac2)}
.gema b{display:block;margin-top:4px;font-size:clamp(14.5px,4.45vw,17.5px);font-weight:800;letter-spacing:-.025em;white-space:nowrap;line-height:1.2}
.uso{padding:0 13px 12px}
.uso-b{display:block;height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
.uso-b i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.uso small{display:block;margin-top:6px;font-size:12.5px;font-weight:500;color:var(--muted)}
.sub-cab{padding:calc(var(--seg-t) + 20px) 20px 6px}
.sub-cab h1{font-size:29px;font-weight:800;letter-spacing:-.025em}
.sub-cab p{font-size:14.5px;color:var(--ink2);margin-top:2px}

.pila{padding:0 14px;display:flex;flex-direction:column;gap:20px;margin-top:10px}
.cab + .pila{margin-top:14px}
.sec{min-width:0}
.sec-cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 4px 9px}
.sec-cab h2{font-size:19.5px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.sec-cab button{flex:none;font-size:13.5px;font-weight:700;color:var(--ac)}
.sec .tar>.apunte:first-child{margin-top:0!important}
.carrusel{display:flex;gap:9px;overflow-x:auto;margin:0 -14px -10px;padding:2px 14px 14px;scroll-snap-type:x proximity;scroll-padding:14px;scrollbar-width:none}
.carrusel::-webkit-scrollbar{display:none}
.ins{flex:none;width:152px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;padding:13px 13px 12px;border-radius:20px;text-align:left;min-width:0;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sombra);transition:transform .15s ease}
.ins:active{transform:scale(.965)}
.ins i{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:13.5px;margin-bottom:9px;color:var(--c);background:var(--card2);background:color-mix(in srgb,var(--c) 15%,transparent)}
.ins small{font-size:12.5px;font-weight:600;color:var(--ink2)}
.ins b{font-size:20px;font-weight:800;letter-spacing:-.025em;line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins span{max-width:100%;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tar{background:var(--card);border-radius:22px;padding:16px 15px;box-shadow:var(--sombra),inset 0 1px 0 rgba(255,255,255,.05);
     border:1px solid var(--line);min-width:0}
.tar-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.tar-cab h2{font-size:18.5px;font-weight:800;letter-spacing:-.015em;line-height:1.2;display:flex;align-items:center;gap:9px}
.tar-cab h2::before{content:"";width:5px;height:21px;border-radius:3px;background:linear-gradient(180deg,var(--ac),var(--ac2));flex:none}
.tar-cab button,.enlace{font-size:14px;font-weight:700;color:var(--ac)}
.apunte{font-size:14px;line-height:1.45;color:var(--ink2)}
.tar-grad{position:relative;overflow:hidden;isolation:isolate;display:block;width:100%;text-align:left;color:#fff;
          background:var(--grad);border:0;padding:19px 18px;border-radius:var(--r-l)}
.tar-grad h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.tar-grad p{font-size:14px;color:rgba(255,255,255,.88);margin-top:3px;padding-right:44px}
.tar-grad em{position:absolute;right:16px;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;
             background:rgba(255,255,255,.2);display:grid;place-items:center;font-style:normal;font-size:14px}
.tar-grad em .ic{fill:currentColor;margin-left:2px}
.tar-grad:active{transform:scale(.985)}
.tar-grad::after{content:"";position:absolute;z-index:-1;top:0;bottom:0;width:38%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);animation:reflejo 4.8s ease-in-out infinite}
@keyframes reflejo{0%{transform:translateX(0)}55%,100%{transform:translateX(370%)}}
.rev{opacity:0;transform:translateY(24px) scale(.97)}
.rev.ver{opacity:1;transform:none;transition:opacity .55s ease,transform .7s cubic-bezier(.16,1,.3,1)}
.liq{position:relative;flex:none;width:78px;height:78px;border-radius:50%;overflow:hidden;isolation:isolate;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line2),0 0 22px -8px var(--glow);transform:translateZ(0)}
.liq .ola{position:absolute;left:-65%;width:230%;height:230%;top:calc(100% - var(--p,0)*1%);border-radius:42%;background:linear-gradient(180deg,var(--ac),var(--ac3));opacity:.55;animation:gira 7s linear infinite;transition:top 1.5s cubic-bezier(.16,1,.3,1)}
.liq .ola + .ola{border-radius:38%;opacity:.8;animation-duration:10.5s}
.liq.llena .ola{background:linear-gradient(180deg,var(--ac2),var(--foil))}
.liq span{position:absolute;inset:0;z-index:2;display:grid;place-items:center;font-size:22px;color:var(--ink);filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.liq small{position:absolute;z-index:2;left:0;right:0;bottom:6px;text-align:center;font-size:10.5px;font-weight:800;color:var(--ink);text-shadow:0 1px 3px var(--bg)}
.toque{position:fixed;z-index:95;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;border:2px solid var(--ac);box-shadow:0 0 16px var(--glow);animation:toque .55s ease-out both}
@keyframes toque{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(6.5)}}
.orbe{position:fixed;z-index:62;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff,var(--ac2) 45%,transparent 72%);box-shadow:0 0 22px 7px var(--glow)}
.pant.pulso{animation:pulso .2s ease-out}
@keyframes pulso{50%{transform:scale(1.045)}}
.paletas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pal{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 3px 8px;border-radius:15px;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.pal i{width:38px;height:38px;border-radius:50%;display:block;transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.pal[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 0 0 2px var(--ac)}
.pal[aria-pressed="true"] i{transform:scale(1.12)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:circulo .6s cubic-bezier(.3,.8,.3,1) both}
@keyframes circulo{from{clip-path:circle(0 at var(--vx,50%) var(--vy,50%))}to{clip-path:circle(150% at var(--vx,50%) var(--vy,50%))}}

/* grafico de 6 meses */
.barras{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;height:176px;align-items:stretch;
  background:repeating-linear-gradient(180deg,transparent 0 37px,var(--line) 37px 38px);background-size:100% 114px;background-repeat:no-repeat;background-position:0 22px}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;border-radius:15px;padding:4px 0 5px;min-width:0;position:relative}
.bcol[aria-current="true"]{background:linear-gradient(180deg,transparent,var(--ac-s))}
.bval{position:absolute;top:0;left:50%;transform:translateX(-50%);padding:3px 7px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap;color:var(--boton-t);background:var(--ok);box-shadow:0 6px 14px -7px var(--ok)}
.bval.neg{color:#3a0d08;background:var(--mal);box-shadow:0 6px 14px -7px var(--mal)}
.bpar{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:114px}
.bpar i{display:block;width:10px;min-height:3px;border-radius:5px;transform-origin:bottom;opacity:.42;transition:opacity .25s ease}
.bpar .i{background:var(--ok)} .bpar .g{background:var(--mal)}
.bcol[aria-current="true"] .bpar i{opacity:1;box-shadow:0 0 14px -3px currentColor}
.bcol[aria-current="true"] .bpar .i{color:var(--ok)} .bcol[aria-current="true"] .bpar .g{color:var(--mal)}
.fantasmas{position:absolute;inset:0 0 28px;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;align-items:end;pointer-events:none}
.fantasmas i{display:block;width:26px;justify-self:center;border-radius:6px 6px 2px 2px;background:linear-gradient(100deg,var(--card2) 30%,var(--card3) 50%,var(--card2) 70%);background-size:220% 100%;animation:brillo-f 1.9s linear infinite}
@keyframes brillo-f{from{background-position:120% 0}to{background-position:-120% 0}}
.nada-g{position:absolute;left:41%;top:36%;transform:translate(-50%,-50%);width:74%;text-align:center;font-size:14px;font-weight:600;color:var(--ink2);padding:9px 13px;border-radius:13px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.anim .bpar i{animation:crece .75s cubic-bezier(.2,1.1,.3,1) both}
.anim .bcol:nth-child(2) i{animation-delay:.05s}.anim .bcol:nth-child(3) i{animation-delay:.1s}
.anim .bcol:nth-child(4) i{animation-delay:.15s}.anim .bcol:nth-child(5) i{animation-delay:.2s}
.anim .bcol:nth-child(6) i{animation-delay:.25s}
@keyframes crece{from{transform:scaleY(0)}to{transform:none}}
.bmes{font-size:13px;font-weight:600;color:var(--muted);text-transform:capitalize}
.bcol[aria-current="true"] .bmes{color:var(--ink)}
.ley{display:flex;gap:14px;margin-top:9px;font-size:12.5px;font-weight:600;color:var(--muted);flex-wrap:wrap}
.ley span{display:inline-flex;align-items:center;gap:6px}
.ley i{width:9px;height:9px;border-radius:50%;display:block}
.top{display:flex;align-items:center;gap:12px;margin-top:15px;padding:13px 14px;border-radius:var(--r-m);
     background:linear-gradient(100deg,rgba(255,187,85,.13),rgba(255,122,120,.07));border:1px solid var(--line);font-size:14.5px;line-height:1.38}
.top>.ic{font-size:21px;color:var(--ac2)}
.top b{font-weight:800}

/* categorias */
.reparto{display:flex;gap:2px;height:11px;border-radius:6px;overflow:hidden;margin-bottom:13px}
.reparto i{display:block;min-width:3px}
.anim .reparto{animation:llena .9s cubic-bezier(.2,.9,.3,1) both;transform-origin:left}
.cat-f{display:block;width:100%;text-align:left;padding:10px 0}
.cat-f:first-child{padding-top:0}
.cat-f:last-child{padding-bottom:0}
.cat-l{display:flex;align-items:center;gap:11px}
.azulejo{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:16.5px;color:var(--c,var(--ac));
  background:var(--card2);background:color-mix(in srgb,var(--c,var(--ac)) 15%,transparent)}
:root[data-tema="claro"] .azulejo{color:color-mix(in srgb,var(--c,var(--ac)) 66%,#10201a)}
.cat-n{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-n small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
.cat-i{font-weight:700;font-size:15px;white-space:nowrap;text-align:right}
.cat-i small{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.ver-mas{display:block;width:100%;margin-top:11px;padding:10px;border-radius:12px;font-size:14px;font-weight:700;color:var(--ink);background:var(--card2)}
.cinta{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin:7px 0 0 51px}
.cinta i{position:relative;overflow:hidden;display:block;height:100%;border-radius:4px;background:var(--c,var(--ac));transform-origin:left;transition:width .5s cubic-bezier(.2,.9,.3,1)}
.cinta i::after{content:"";position:absolute;inset:0;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:destello 3.4s ease-in-out infinite}
@keyframes destello{0%{transform:translateX(-120%)}55%,100%{transform:translateX(320%)}}
.anim .cinta i{animation:llena .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes llena{from{transform:scaleX(0)}to{transform:none}}
table.tabla{width:100%;border-collapse:collapse;font-size:14.5px}
.tabla th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:right;padding:0 0 8px}
.tabla th:first-child,.tabla td:first-child{text-align:left}
.tabla td{padding:10px 0;border-top:1px solid var(--line);text-align:right;font-weight:600}
.tabla td:first-child{font-weight:700}
.tabla .ic{font-size:13px;color:var(--muted);margin-right:3px}

/* movimientos */
.dia{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--muted);
     padding:13px 2px 5px}
.dia span:first-child::first-letter{text-transform:uppercase}
.dia:first-child{padding-top:0}
.mov-w{position:relative;border-radius:var(--r-s);overflow:hidden;background:var(--mal)}
.mov-w + .mov-w{margin-top:2px}
.mov-w::after{content:"Borrar";position:absolute;right:16px;top:50%;margin-top:-10px;font-size:14px;font-weight:700;color:#fff}
.mov{position:relative;z-index:1;display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 2px;
     background:var(--card);touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.9,.3,1)}
.mov.arrastra{transition:none}
.mov-t{flex:1;min-width:0}
.mov-t b{display:block;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-t small{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.etq{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--ac-s);color:var(--ac)}
.mov-i{font-weight:700;font-size:15.5px;white-space:nowrap}
.nuevo{animation:nuevo .55s cubic-bezier(.2,1.2,.3,1) both}
@keyframes nuevo{from{opacity:0;transform:scale(.92) translateY(-8px)}to{opacity:1;transform:none}}
.buscar{display:flex;align-items:center;gap:10px;height:50px;padding:0 15px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.buscar>.ic{font-size:15px;color:var(--muted)}
.buscar input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px}
.buscar input::placeholder{color:var(--muted)}
.fichas{display:flex;gap:7px;overflow-x:auto;padding:1px 14px 3px;margin:0 -14px;scrollbar-width:none}
.fichas::-webkit-scrollbar{display:none}
.ficha{flex:none;height:37px;padding:0 13px;border-radius:19px;background:var(--card);border:1px solid var(--line);
       font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:transform .15s ease}
.ficha .ic{font-size:12.5px;margin-right:2px}
.ficha:active{transform:scale(.94)}
.ficha[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:16px;background:var(--hundido);box-shadow:inset 0 0 0 1px var(--line)}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,2));border-radius:12px;background:var(--card3);box-shadow:0 2px 7px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateX(calc(var(--i,0)*100%));transition:transform .36s cubic-bezier(.2,1.1,.35,1)}
.seg button{position:relative;height:42px;border-radius:12px;font-weight:700;font-size:15px;color:var(--muted);transition:color .2s ease}
.seg button[aria-pressed="true"]{color:var(--ink)}
:root[data-tema="claro"] .seg::before{background:var(--card)}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-d{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px}
.cel{position:relative;aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;
     font-size:14px;font-weight:700;background:var(--card2);min-width:0;line-height:1.05}
.cel>em{position:absolute;inset:0;border-radius:inherit;background:var(--ac)}
.cel>span,.cel>small{position:relative}
.cel small{font-size:9.5px;font-weight:700;opacity:.92;max-width:100%;overflow:hidden}
.cel.hueco{background:none}
.cel.hoy{box-shadow:inset 0 0 0 2px var(--ac)}
.cel[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.cel u{position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.escala{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-top:11px}
.escala div{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;height:8px}
.escala div i:first-child{border-radius:4px 0 0 4px}.escala div i:last-child{border-radius:0 4px 4px 0}

/* planes */
.anillo{position:relative;flex:none;display:grid;place-items:center}
.anillo svg{display:block;transform:rotate(-90deg)}
.anillo circle{fill:none;stroke-linecap:round}
.anillo .pista{stroke:var(--card2)}
.anillo .pro{transition:stroke-dashoffset 1s cubic-bezier(.2,.9,.3,1)}
.anillo span{position:absolute;font-weight:800}
.total-pres{display:flex;align-items:center;gap:16px}
.total-pres h3{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.total-pres p{font-size:14px;color:var(--ink2);margin-top:3px;line-height:1.35}
.meta{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.meta + .meta{margin-top:0}
.meta-t{flex:1;min-width:0}
.meta-t b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta-t>span{display:block;font-size:14px;color:var(--ink2);margin-top:1px}
.meta-t small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border-radius:16px;
     font-weight:700;font-size:16px;background:var(--grad);color:#fff;transition:transform .13s ease}
.btn:active{transform:scale(.975)}
.btn.sec{background:var(--card2);color:var(--ink)}
.btn.pel{background:var(--mal-s);color:var(--mal)}
.btn.lin{background:none;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink)}
.btn[disabled]{opacity:.45}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* analisis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px 13px 12px;min-width:0;box-shadow:var(--sombra)}
.kpi i{display:grid;place-items:center;width:32px;height:32px;margin-bottom:9px;border-radius:11px;font-size:13.5px;color:var(--c,var(--ac));background:var(--card2);background:color-mix(in srgb,var(--c,var(--ac)) 15%,transparent)}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;line-height:1.15}
.kpi span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-top:2px;line-height:1.25}
.t{font-family:var(--sans);font-size:11.5px;font-weight:600;fill:var(--muted)}
.linea-dato{min-height:1.4em;margin-top:6px;font-size:14px;font-weight:700;color:var(--ink2)}
svg.curva{display:block;width:100%;height:auto;touch-action:pan-y}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;height:138px;align-items:end}
.sem-c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.sem-c small{font-size:10.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.sem-c i{display:block;width:62%;min-height:3px;border-radius:5px 5px 2px 2px;background:var(--card3);transform-origin:bottom}
.sem-c.max i{background:linear-gradient(180deg,var(--ac2),var(--ac))}
.sem-c span{font-size:12.5px;font-weight:700;color:var(--muted)}
.anim .sem-c i{animation:crece .7s cubic-bezier(.2,1.1,.3,1) both}
.fila-d{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.fila-d:first-child{border-top:0;padding-top:0}.fila-d:last-child{padding-bottom:0}
.ano{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;height:120px}
.ano button{position:relative;height:100%;min-width:0;border-radius:6px}
.ano button[aria-current="true"]{background:var(--card2)}
.ano i{position:absolute;left:14%;right:14%;border-radius:3px;display:block}
.ano .cero{position:absolute;left:0;right:0;top:44%;height:1px;background:var(--line2)}
.ano small{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;color:var(--muted)}

/* barra inferior */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--seg-b));z-index:30;width:min(calc(100% - 24px),536px);
     height:68px;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;border-radius:26px;padding:0 5px;
     background:var(--card);background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line2);box-shadow:0 18px 40px -16px rgba(0,0,0,.65);
     -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5)}
.pasti{position:absolute;top:5px;height:58px;left:0;width:60px;border-radius:18px;background:var(--ac-s);box-shadow:inset 0 0 0 1px var(--line);
       transition:transform .42s cubic-bezier(.2,1.25,.35,1),width .3s ease;pointer-events:none}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;height:58px;justify-content:center;border-radius:18px;
     font-size:11.5px;font-weight:700;color:var(--muted);transition:color .18s ease}
.tab svg{width:23px;height:23px;transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.12);stroke:var(--ac);filter:drop-shadow(0 0 7px var(--glow))}
.fab{justify-self:center;width:60px;height:60px;border-radius:50%;margin-top:-28px;display:grid;place-items:center;color:var(--sobre-ac);background:var(--ac);
     box-shadow:0 0 0 5px var(--bg),0 12px 26px -8px var(--glow);position:relative;transition:transform .17s cubic-bezier(.2,1.5,.4,1)}
@keyframes gira{to{transform:rotate(360deg)}}
.fab:active{transform:scale(.88) rotate(45deg)}
.fab svg{width:27px;height:27px;stroke-width:2.5}

/* hojas */
/* Lo que pasa por debajo de la barra se funde con el fondo en vez de asomar cortado */
.nav-fundido{display:none;position:fixed;left:0;right:0;bottom:0;height:calc(104px + var(--seg-b));z-index:29;pointer-events:none;
  background:linear-gradient(to top,var(--bg) 46%,transparent)}
#nav:not([hidden]) + .nav-fundido{display:block}
.velo{position:fixed;inset:0;z-index:50;touch-action:none;background:rgba(2,6,5,.62);opacity:0;transition:opacity .25s ease;
      -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.velo.on{opacity:1}
.hoja{position:fixed;left:50%;bottom:0;z-index:51;width:100%;max-width:560px;max-height:90vh;max-height:calc(100dvh - var(--seg-t) - 18px);overflow-y:auto;
      background:var(--bg);border-radius:30px 30px 0 0;box-shadow:var(--sombra-sube);border-top:1px solid var(--line2);
      padding:8px 16px calc(18px + var(--seg-b));transform:translate(-50%,102%);transition:transform .36s cubic-bezier(.2,.95,.25,1);overscroll-behavior:none;-webkit-overflow-scrolling:touch}
:root[data-tema="claro"] .hoja{background:var(--card)}
.hoja.on{transform:translate(-50%,0)}
.asa{display:block;width:100%;padding:8px 0 14px;touch-action:none}
.asa::before{content:"";display:block;width:44px;height:5px;border-radius:3px;margin:0 auto;background:var(--line2)}
.hoja h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:13px}
.hoja p.ayuda{font-size:14px;color:var(--ink2);margin:-6px 0 14px;line-height:1.45}
.campo{display:block;margin-bottom:12px}
.campo>span{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 5px 2px}
.campo input,.campo select{display:block;width:100%;height:50px;padding:0 13px;font-size:16px;border-radius:14px;border:1px solid var(--line2);background:var(--card);outline:0;-webkit-appearance:none;appearance:none}
.campo input:focus,.campo select:focus{border-color:var(--ac)}
:root[data-tema="claro"] .campo input,:root[data-tema="claro"] .campo select{background:var(--card2)}
.pant{text-align:center;font-size:clamp(46px,14vw,58px);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:2px 0 9px;white-space:nowrap}
.pant.gasto{color:var(--ink)} .pant.ingreso{color:var(--ok)}
.tiembla{animation:tiembla .34s ease}
@keyframes tiembla{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.cats{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:94px;gap:4px;overflow-x:auto;padding:3px 16px 9px;margin:9px -16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-b{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:14px;font-size:11.5px;font-weight:700;color:var(--ink2);min-width:0}
.cat-b .ic{font-size:19px;color:var(--c,var(--ac));transition:transform .25s cubic-bezier(.2,1.7,.4,1)}
:root[data-tema="claro"] .cat-b .ic{color:color-mix(in srgb,var(--c,var(--ac)) 66%,#10201a)}
.cat-b span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-b[aria-pressed="true"]{background:var(--card2);box-shadow:inset 0 0 0 2px var(--ac);color:var(--ink)}
.cat-b[aria-pressed="true"] .ic{transform:scale(1.18)}
.nota-f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:9px}
.nota-f input{min-width:0;height:46px;padding:0 13px;border-radius:13px;border:1px solid var(--line2);background:var(--card);font-size:16px;outline:0}
.nota-f input::placeholder{color:var(--muted)}
.nota-f input[type=date]{width:144px;font-size:16px;padding:0 6px;font-weight:600}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}
.tec{height:52px;border-radius:15px;background:var(--card);font-size:23px;font-weight:700;transition:transform .09s ease,background .09s ease}
.tec .ic{font-size:20px}
.tec:active{transform:scale(.93);background:var(--ac-s);box-shadow:0 0 18px -6px var(--glow)}
:root[data-tema="claro"] .tec{background:var(--card2)}
.pasos{display:flex;gap:7px;overflow-x:auto;margin:0 -16px 9px;padding:0 16px;scrollbar-width:none}
.pasos::-webkit-scrollbar{display:none}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:12px}
.emojis button{aspect-ratio:1;border-radius:10px;font-size:17px;color:var(--ink2);display:grid;place-items:center}
.emojis button[aria-pressed="true"]{background:var(--ac-s);color:var(--ac);box-shadow:inset 0 0 0 2px var(--ac)}

.aj{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:9px 0;border-top:1px solid var(--line);text-align:left;font-weight:600}
.aj:first-child{border-top:0}
.aj small{display:block;font-size:13px;font-weight:500;color:var(--muted);line-height:1.3}
.aj .fin{margin-left:auto;color:var(--muted);flex:none}
.aj>.ic{font-size:17px;width:26px;color:var(--ink2)}
.aj .fin .ic{font-size:15px;vertical-align:-.3em}
.int{position:relative;margin-left:auto;flex:none;width:50px;height:30px;border-radius:15px;background:var(--card3);transition:background .18s ease}
.int::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .18s cubic-bezier(.2,1.4,.4,1)}
[aria-checked="true"] .int{background:var(--ok)}
[aria-checked="true"] .int::after{transform:translateX(20px)}

.aviso{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.38;font-weight:500;
       background:linear-gradient(0deg,var(--ambar-s),var(--ambar-s)),var(--card);border:1px solid var(--line);width:100%;text-align:left;box-shadow:var(--sombra)}
.aviso b{font-weight:800}
.vacio{text-align:center;padding:26px 14px}
.vacio-i{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 12px;border-radius:50%;font-size:22px;color:var(--ac);background:var(--ac-s);box-shadow:0 0 26px -10px var(--glow)}
.vacio h3{font-size:18px;font-weight:800}
.vacio p{font-size:14.5px;color:var(--ink2);margin:4px auto 15px;max-width:30ch}
.vacio .btn{width:auto;display:inline-flex}

#tostada{position:fixed;left:50%;bottom:calc(92px + var(--seg-b));z-index:70;transform:translate(-50%,24px);opacity:0;pointer-events:none;
         width:min(calc(100% - 28px),500px);display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:16px;background:#1a2622;color:#fff;
         font-size:14.5px;font-weight:600;line-height:1.3;box-shadow:0 16px 36px -12px rgba(0,0,0,.75);transition:opacity .22s ease,transform .3s cubic-bezier(.2,1.3,.4,1)}
#tostada.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#tostada span{flex:1;min-width:0}
#tostada button{font-weight:800;color:var(--foil);flex:none;padding:3px 0 3px 6px}
#flota{position:fixed;z-index:60;pointer-events:none;font-weight:800;font-size:23px;left:50%;bottom:110px;transform:translateX(-50%);opacity:0}
#flota.va{animation:flota 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes flota{0%{opacity:0;transform:translate(-50%,16px) scale(.8)}18%{opacity:1;transform:translate(-50%,-10px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-150px) scale(.92)}}
#tiron{position:fixed;left:50%;top:calc(var(--seg-t) + 4px);z-index:45;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--ink2);
  background:var(--card);box-shadow:0 8px 22px -8px rgba(0,0,0,.7),inset 0 0 0 1px var(--line2);transform:translate(-50%,-48px);opacity:0;pointer-events:none}
#tiron span{display:grid;place-items:center}
#tiron.listo{color:var(--boton-t);background:var(--ac);box-shadow:0 8px 24px -6px var(--glow)}
#tiron.gira span{animation:gira .7s linear infinite}
#lluvia{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

/* bienvenida */
.bien{position:fixed;inset:0;z-index:80;overflow:auto;color:#fff;background:var(--grad);isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;
      padding:calc(var(--seg-t) + 30px) 24px calc(24px + var(--seg-b))}
.bien .aurora{position:fixed}
.bien h1{font-size:clamp(46px,14vw,66px);font-weight:800;letter-spacing:-.04em;line-height:1}
.bien p{font-size:17px;line-height:1.45;margin:13px 0 22px;color:rgba(255,255,255,.92);max-width:34ch}
.bien input{display:block;width:100%;height:56px;padding:0 17px;font-size:17px;font-weight:600;border-radius:17px;border:0;outline:0;margin-bottom:10px;
            background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.bien input::placeholder{color:rgba(255,255,255,.76)}
.bien .btn{background:#fff;color:var(--boton-t);margin-bottom:9px}
.bien .btn.sec{background:rgba(13,14,24,.3);color:#fff}
.moneda-3d{position:absolute;right:-30px;top:12%;width:210px;height:210px;border-radius:50%;display:grid;place-items:center;font-size:92px;font-weight:800;color:rgba(255,255,255,.92);
           background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.42),rgba(255,255,255,.08) 60%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.32),0 30px 60px -20px rgba(20,10,70,.6);
           animation:flotar 6s ease-in-out infinite alternate}
@keyframes flotar{to{transform:translateY(22px) rotate(-8deg)}}

/* stories */
.hist{position:fixed;inset:0;z-index:75;color:#fff;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;
      padding:calc(var(--seg-t) + 12px) 22px calc(26px + var(--seg-b));user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .5s ease}
.hist .aurora{position:absolute;opacity:.75}
.hist-b{display:flex;gap:4px}
.hist-b i{flex:1;height:3.5px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;display:block}
.hist-b u{display:block;height:100%;width:0;background:#fff;border-radius:2px}
.hist-b .ya u{width:100%}
.hist-b .act u{animation:avanza var(--dur) linear forwards}
.hist.pausa .hist-b .act u{animation-play-state:paused}
@keyframes avanza{to{width:100%}}
.hist-c{position:absolute;right:15px;top:calc(var(--seg-t) + 25px);z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.22);font-size:20px;display:grid;place-items:center;color:#fff}
.hist-s{flex:1;display:flex;flex-direction:column;justify-content:center;gap:9px;max-width:480px;width:100%;margin:0 auto}
.hist-s>*{animation:sube .62s cubic-bezier(.16,1.1,.3,1) both}
.hist-s>*:nth-child(2){animation-delay:.14s}.hist-s>*:nth-child(3){animation-delay:.28s}.hist-s>*:nth-child(4){animation-delay:.42s}
@keyframes sube{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.hist-k{font-size:19px;font-weight:700;color:rgba(255,255,255,.9)}
.hist-g{font-size:clamp(54px,17vw,84px);font-weight:800;letter-spacing:-.04em;line-height:1.02}
.hist-e{display:grid;place-items:center;width:104px;height:104px;margin-bottom:8px;border-radius:50%;font-size:40px;color:#fff;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 18px 40px -14px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:pop .7s cubic-bezier(.2,1.8,.4,1) both!important}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-14deg)}to{opacity:1;transform:none}}
.hist-t{font-size:20px;font-weight:600;line-height:1.35;color:rgba(255,255,255,.94);max-width:30ch}
.hist .btn{background:#fff;color:var(--boton-t);margin-top:14px;position:relative;z-index:4}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (min-width:561px){.cab{border-radius:0 0 44px 44px}}
@media (max-width:359px){.gema{padding:11px 9px}.gemelas{grid-template-columns:1.15fr 1.15fr .7fr}.redondo{width:36px;height:36px}}

/* ---- cuentas ---- */
.sub-fila{display:flex;align-items:center;gap:11px}
.sub-fila h1{flex:1;min-width:0}
.sub-fila .redondo{order:0}
.dinero{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:20px;text-align:left;background:var(--card);border:1px solid var(--line);box-shadow:var(--sombra);transition:transform .15s ease}
.dinero:active{transform:scale(.98)}
.dinero i{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:15px;color:var(--ac);background:var(--ac-s)}
.dinero span{flex:1;min-width:0}
.dinero small{display:block;font-size:13px;font-weight:600;color:var(--ink2);line-height:1.3}
.dinero b{display:block;font-size:17.5px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.dinero>.ic{flex:none;font-size:14px;color:var(--muted)}
.hero-pat{padding:6px 6px 0}
.hero-pat>small{display:block;font-size:14px;font-weight:600;color:var(--ink2)}
.hero-pat>b{display:block;font-size:clamp(36px,11vw,46px);font-weight:800;letter-spacing:-.04em;line-height:1.12}
.hero-pat>span{display:block;font-size:14px;font-weight:700;margin-bottom:12px}
.spark.bajo{height:140px;cursor:default;touch-action:auto}
.spark.bajo .y-et{right:0}
.titular{font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.cta-cab{display:flex;align-items:center;gap:12px}
.cta-cab small{font-size:13px;color:var(--ink2)}
.cta-cab h2{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.cta-saldo{display:block;margin-top:10px;font-size:33px;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.mal-e{background:var(--mal-s);color:var(--mal)}

/* ---- apuntar rapido ---- */
.frec{display:flex;gap:7px;overflow-x:auto;margin:0 -18px 9px;padding:1px 18px;scrollbar-width:none}
.frec:empty{display:none}
.frec::-webkit-scrollbar{display:none}
.frec .ficha{height:34px;font-size:13.5px;background:var(--card2);white-space:nowrap}
.q-ctas{margin:0 -18px 9px;padding:1px 18px}
.q-ctas .ficha{height:34px;font-size:13.5px;white-space:nowrap}

/* ---- importar ---- */
.imp-res{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0}
.imp-res div{padding:10px 12px;border-radius:14px;background:var(--card2)}
.imp-res small{display:block;font-size:12.5px;font-weight:600;color:var(--ink2)}
.imp-res b{font-size:17.5px;font-weight:800;letter-spacing:-.02em}
.imp-col{margin:6px 0 10px;font-size:14px}
.imp-col summary{padding:8px 0;font-weight:700;color:var(--ac);list-style:none;cursor:pointer}
.imp-col summary::-webkit-details-marker{display:none}
.imp-f{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);transition:opacity .15s ease}
.imp-f.off{opacity:.5}
.imp-c{width:26px;height:26px;margin-top:2px;border-radius:9px;display:grid;place-items:center;font-size:12px;color:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.imp-c[aria-pressed="true"]{color:var(--sobre-ac);background:var(--ac);box-shadow:none}
.imp-t{min-width:0}
.imp-t b{display:block;font-size:14.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-t small{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.imp-s{display:block;max-width:100%;margin-top:4px;padding:3px 0;font:inherit;font-size:13px;font-weight:700;color:var(--ac);background:none;border:0;outline:0;-webkit-appearance:none;appearance:none}
.imp-i{font-size:14.5px;font-weight:700;white-space:nowrap}
.imp-pie{position:sticky;bottom:calc(var(--seg-b) * -1);margin:12px -18px -4px;padding:10px 18px calc(var(--seg-b) + 6px);background:linear-gradient(to top,var(--card) 72%,transparent)}
:root[data-tema="claro"] .imp-pie{background:linear-gradient(to top,var(--card) 72%,transparent)}

/* ---- salud ---- */
.factores{display:grid;gap:11px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.factor>div{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.factor b{font-size:14px;font-weight:700}
.factor small{font-size:12.5px;color:var(--ink2);text-align:right}
.factor .cinta{display:block;margin:6px 0 0}
.factor.sin{opacity:.6}
.r50 + .r50{margin-top:13px}
.r50-c{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.r50-p{flex:none;text-align:right;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.r50-p small{display:block;font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted)}
.r50-b{position:relative;display:block;height:7px;margin-top:7px;border-radius:4px;background:var(--card2)}
.r50-b i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.2,.9,.3,1)}
.r50-b u{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink)}

/* ---- bloqueo ---- */
#cerrojo{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:calc(var(--seg-t) + 20px) 24px calc(var(--seg-b) + 16px);background:var(--bg);transition:opacity .2s ease}
#cerrojo.fuera{opacity:0;pointer-events:none}
#cerrojo::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 55% at 50% 0,var(--f1),transparent 70%)}
.cj-c{text-align:center}
.cj-i{display:inline-grid;place-items:center;width:58px;height:58px;margin-bottom:13px;border-radius:19px;font-size:22px;color:var(--sobre-ac);background:var(--ac)}
.cj-c h2{font-size:23px;font-weight:800;letter-spacing:-.02em}
.cj-c p{min-height:21px;margin-top:3px;font-size:14.5px;color:var(--ink2)}
.cj-p{display:flex;justify-content:center;gap:15px;margin-top:17px}
.cj-p i{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line2);transition:background .12s ease}
.cj-p i.on{background:var(--ac);box-shadow:none}
.cj-p.tiembla{animation:tiembla .34s ease}
.cj-t{display:grid;grid-template-columns:repeat(3,76px);gap:12px 20px;justify-content:center}
.cj-k{width:76px;height:76px;border-radius:50%;font-size:29px;font-weight:600;color:var(--ink);background:var(--vidrio);transition:transform .1s ease,background .1s ease}
.cj-k:active{transform:scale(.92);background:var(--line2)}
.cj-k .ic{font-size:24px;vertical-align:middle}
.cj-bio{color:var(--ac)}
.cj-o{min-height:32px}
@media (max-height:640px){#cerrojo{gap:14px}.cj-i{display:none}.cj-t{grid-template-columns:repeat(3,62px);gap:8px 18px}.cj-k{width:62px;height:62px;font-size:24px}}
html.tapado #app,html.tapado .nav,html.tapado .hoja{filter:blur(26px)}

</style>
</head>

/* ---- copia automatica cifrada ----
   Los datos se cifran aqui con AES-GCM y una clave sacada de tu contrasena.
   El servidor solo recibe texto ilegible. La configuracion va en una clave
   aparte para que nunca entre en las copias ni en lo que se exporta. */
const CLAVE_COPIA = 'mis-finanzas-copia';
const ITER = 600000;
let C = null, tCopia = null, subiendo = false;
function cargaCopia() { try { C = JSON.parse(localStorage.getItem(CLAVE_COPIA) || 'null'); } catch (e) { C = null; } }
function guardaCopia() { try { C ? localStorage.setItem(CLAVE_COPIA, JSON.stringify(C)) : localStorage.removeItem(CLAVE_COPIA); } catch (e) {} }
const aB64 = b => { let s = ''; const u = new Uint8Array(b); for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };
const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function claveDe(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function cifra(texto, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await claveDe(pass, salt, ITER), new TextEncoder().encode(texto));
  return {v: 1, alg: 'AES-GCM', iter: ITER, salt: aB64(salt), iv: aB64(iv), data: aB64(data)};
}
async function descifra(o, pass) {
  const k = await claveDe(pass, deB64(o.salt), o.iter);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: deB64(o.iv)}, k, deB64(o.data)));
}
function leeConexion(txt) {
  try {
    const t = String(txt).trim();
    if (!t.startsWith('fin1:')) return null;
    let b = t.slice(5).replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    const j = JSON.parse(atob(b));
    return /^https:\/\//.test(j.u) && j.t ? {u: j.u, t: j.t} : null;
  } catch (e) { return null; }
}
async function llamaServidor(con, cuerpo) {

/* Tirar hacia abajo desde arriba del todo: guarda lo pendiente y recarga la app */
const TIRON = 78;
let P = null, recargando = false;
function pintaTiron(d) {
  const r = $('#tiron'), a = $('#app'), nav = $('#nav');
  const p = Math.min(1, d / TIRON);
  r.style.transform = `translate(-50%,${Math.min(d, TIRON + 26) - 48}px)`;
  r.style.opacity = String(Math.min(1, p * 1.4));
  r.firstElementChild.style.transform = `rotate(${d * 3.4}deg)`;
  r.classList.toggle('listo', d >= TIRON);
  a.style.transform = d ? `translateY(${d * .42}px)` : '';
  if (nav) nav.style.opacity = d ? String(1 - p * .35) : '';
}
function sueltaTiron() {
  const r = $('#tiron'), a = $('#app');
  r.style.transition = a.style.transition = 'transform .32s cubic-bezier(.2,.9,.3,1),opacity .2s ease';
  pintaTiron(0);
  setTimeout(() => { r.style.transition = a.style.transition = ''; }, 340);
}
async function recarga() {
  recargando = true;
  const r = $('#tiron'), a = $('#app');
  r.classList.add('gira');
  r.style.transition = a.style.transition = 'transform .25s ease';
  r.style.transform = 'translate(-50%,30px)';
  a.style.transform = `translateY(${TIRON * .42}px)`;
  /* Lo pendiente se guarda antes de recargar, sin esperar mas de 4 segundos */
  if (C && C.pendiente) await Promise.race([subeCopia(), new Promise(ok => setTimeout(ok, 4000))]);
  location.reload();
}
document.addEventListener('touchstart', e => {
  P = null;
  if (recargando || !S || e.touches.length !== 1 || scrollY > 0) return;
  if ($('.hoja') || $('.hist') || $('.bien') || $('#cerrojo') || e.target.closest('input,#nav')) return;
  const c = e.touches[0];
  P = {x: c.clientX, y: c.clientY, va: false, d: 0, aviso: false};
}, {passive: true});
document.addEventListener('touchmove', e => {
  if (!P) return;
  const c = e.touches[0], dx = c.clientX - P.x, dy = c.clientY - P.y;
  if (!P.va) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { P = null; return; }
    if (dy < 4) { if (dy < -6) P = null; return; }
    if (!e.cancelable || scrollY > 0) { P = null; return; }
    P.va = true; G = null;
  }
  e.preventDefault();
  P.d = Math.max(0, dy) * .55;
  pintaTiron(P.d);
  if (P.d >= TIRON && !P.aviso) { P.aviso = true; vibra(); }
  if (P.d < TIRON) P.aviso = false;
}, {passive: false});
const finTiron = () => {
  if (!P) return;
  const p = P; P = null;
  if (!p.va) return;
  tragaClick = true; setTimeout(() => { tragaClick = false; }, 350);
  if (p.d >= TIRON) recarga(); else sueltaTiron();
};

/* ---- CUENTAS Y PATRIMONIO ---- */
const TIPOS_CUENTA = {
  banco: {nom: 'Cuenta corriente', ico: 'landmark', color: '#5b93ff'},
  efectivo: {nom: 'Efectivo', ico: 'banknote', color: '#f2cb4b'},
  ahorro: {nom: 'Ahorro', ico: 'piggy-bank', color: '#3bd695'},
  inversion: {nom: 'Inversiones', ico: 'trending-up', color: '#4cc9f0'},
  tarjeta: {nom: 'Tarjeta de crédito', ico: 'credit-card', color: '#ff9a62'},
  deuda: {nom: 'Préstamo o deuda', ico: 'hand-coins', color: '#ff7a78'},

const tipoCta = c => TIPOS_CUENTA[c.tipo] || TIPOS_CUENTA.banco;
const ctaDe = id => S.cuentas.find(c => c.id === id) || S.cuentas[0];

const signo = x => x.tipo === 'ingreso' ? x.importe : -x.importe;

const AL_DIA = new Set(['banco', 'efectivo', 'tarjeta']);
function saldoCuenta(c, hasta = hoy()) {
  let s = c.ini || 0;
  for (const x of S.movs) if (x.cuenta === c.id && x.fecha <= hasta) s += signo(x);
  for (const t of S.transf) if (t.fecha <= hasta) { if (t.a === c.id) s += t.importe; if (t.de === c.id) s -= t.importe; }
  return s;
}
/* Los traspasos entre cuentas no cambian el total, asi que aqui no hace falta contarlos */
function patrimonio(hasta = hoy()) {
  let s = S.cuentas.reduce((a, c) => a + (c.ini || 0), 0);
  for (const x of S.movs) if (x.fecha <= hasta) s += signo(x);
  return s;
}
const disponible = () => S.cuentas.filter(c => AL_DIA.has(c.tipo)).reduce((a, c) => a + saldoCuenta(c), 0);
const saldoPuesto = () => S.cuentas.some(c => c.aj);
function ajustaSaldo(c, v) { c.ini = (c.ini || 0) + v - saldoCuenta(c); c.aj = hoy(); }

function tarjetaDinero() {
  if (!saldoPuesto()) return `<button class="dinero" data-a="a-cuentas" type="button"><i>${I('landmark')}</i><span><b>¿Cuánto tienes de verdad?</b><small>Pon el saldo de tus cuentas y verás tu dinero real</small></span>${I('chevron-right')}</button>`;
  const n = S.cuentas.length;
  return `<button class="dinero" data-a="a-cuentas" type="button"><i>${I('landmark')}</i><span><small>Mi dinero, ${n} ${n === 1 ? 'cuenta' : 'cuentas'}</small><b class="din">${fmt(patrimonio())}</b></span>${I('chevron-right')}</button>`;
}
function ejeBonito(lo, hi) {
  if (lo > 0) lo = lo === hi ? 0 : Math.max(0, lo - (hi - lo) * .85);
  const paso = pasoEje((hi - lo) || Math.max(Math.abs(hi), 100));
  const a = Math.floor(lo / paso) * paso; let b = Math.ceil(hi / paso) * paso;
  if (a === b) b += paso;
  return {a, b, paso};
}
/* Grafico pequeno con eje en euros, igual de limpio que el de Inicio */
function lineaEuros(vals, xs, {escalon} = {}) {
  const W = 400, H = 150, L = 14, T = 10, B = 10, e = ejeBonito(Math.min(...vals), Math.max(...vals)), R = Math.max(Math.abs(e.a), Math.abs(e.b)) >= 1e6 ? 84 : 66;
  const X = i => L + i / Math.max(1, vals.length - 1) * (W - L - R), Y = v => T + (e.b - v) / (e.b - e.a) * (H - T - B);
  let rej = '', et = '';
  for (let v = e.a; v <= e.b + 1; v += e.paso) {
    rej += `<path d="M${L} ${Y(v).toFixed(1)}H${W - R + 8}" stroke="var(--line)" vector-effect="non-scaling-stroke"/>`;
    et += `<span class="y-et din" style="top:${(Y(v) / H * 100).toFixed(2)}%">${fmt0(v)}</span>`;
  }
  const pts = vals.map((v, i) => [X(i), Y(v)]), d = escalon ? pts.map(([x, y], i) => `${i ? `H${x.toFixed(1)}V` : `M${x.toFixed(1)} `}${y.toFixed(1)}`).join('') : curvaSuave(pts);
  const [ux, uy] = pts[pts.length - 1], fin = X(vals.length - 1);
  return `<div class="spark bajo"><svg aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="pl-g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".22"/><stop offset=".8" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>
    ${rej}<path d="${d}L${fin.toFixed(1)} ${uy.toFixed(1)}L${fin.toFixed(1)} ${H - B}L${pts[0][0].toFixed(1)} ${H - B}Z" fill="url(#pl-g)"/>
    <path class="sp-l" d="${d}" fill="none" stroke="var(--ac)" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>${et}
    <i class="sp-p" style="left:${(ux / W * 100).toFixed(2)}%;top:${(uy / H * 100).toFixed(2)}%"></i></div>
    <div class="graf-x">${xs.map(([i, t]) => `<span style="left:${(X(i) / W * 100).toFixed(2)}%">${esc(t)}</span>`).join('')}</div>`;
}
function primerMes() {
  let m = mesHoy();
  for (const x of S.movs) if (mesDe(x.fecha) < m) m = mesDe(x.fecha);
  return m;
}
function evolucion() {
  const act = mesHoy(), ini = primerMes(), ms = [];
  for (let k = 11; k >= 0; k--) { const m = sumaMes(act, -k); if (m >= ini) ms.push(m); }
  if (ms.length < 2) return '';
  const vals = ms.map(m => patrimonio(m === act ? hoy() : `${m}-${dos(diasMes(m))}`));
  const i2 = Math.floor((ms.length - 1) / 2);
  return lineaEuros(vals, [[0, nombreMes(ms[0]).slice(0, 3)], [i2, nombreMes(ms[i2]).slice(0, 3)], [ms.length - 1, 'Hoy']]);
}
function prevision(n = 30) {
  const h = hoy(), d0 = aDate(h), dia = k => aFecha(new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + k)), fin = dia(n), ev = [];
  for (const f of S.fijos) if (f.activo) for (let i = 0, m = f.prox; i < 3; i++, m = sumaMes(m, 1)) {
    const fe = fechaFijo(f, m);
    if (fe > h && fe <= fin) ev.push({fecha: fe, c: f.tipo === 'ingreso' ? f.importe : -f.importe, nom: f.nom, cat: f.cat});
  }
  for (const x of S.movs) if (x.fecha > h && x.fecha <= fin) ev.push({fecha: x.fecha, c: signo(x), nom: x.nota || catDe(x.cat).nom, cat: x.cat});
  ev.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : b.c - a.c);
  const ini = disponible(), vals = [];
  let s = ini, j = 0, min = {c: ini, fecha: h};
  for (let k = 0; k <= n; k++) {
    const f = dia(k);
    while (j < ev.length && ev[j].fecha <= f) { s += ev[j].c; j++; }
    vals.push(s);
    if (s < min.c) min = {c: s, fecha: f};

  return {ini, fin: s, min, ev, vals, dia};
}
function tarjetaPrevision() {

    ${lineaEuros(p.vals, [[0, 'Hoy'], [15, fechaCorta(p.dia(15))], [30, fechaCorta(p.dia(30))]], {escalon: true})}
    <div style="margin-top:12px">${p.ev.slice(0, 5).map(e => `<div class="fila-d">${Z(catDe(e.cat))}<span class="cat-n">${esc(e.nom)}<small>${fechaLarga(e.fecha)}</small></span><span class="cat-i ${e.c > 0 ? 'ok' : ''}">${D(e.c)}</span></div>`).join('')}</div>
    <p class="apunte" style="margin-top:10px;font-size:13px">Solo cuenta tus cargos fijos y lo que ya tiene fecha, sin el gasto del día a día.</p></section>`;

function subCuenta(c) {
  if (norm(c.nom) !== norm(tipoCta(c).nom)) return tipoCta(c).nom;
  let u = '';
  for (const x of S.movs) if (x.cuenta === c.id && x.fecha <= hoy() && x.fecha > u) u = x.fecha;

}
function vCuentas() {
  const tot = patrimonio(), ma = sumaMes(mesHoy(), -1), dif = tot - patrimonio(`${ma}-${dos(diasMes(ma))}`);
  const grupos = [['Disponible', ['banco', 'efectivo']], ['Ahorro e inversión', ['ahorro', 'inversion']], ['Deudas', ['tarjeta', 'deuda']]];
  const fila = c => { const s = saldoCuenta(c); return `<button class="cat-f" data-a="cuenta" data-id="${esc(c.id)}" type="button"><span class="cat-l">${ZC(c)}<span class="cat-n">${esc(c.nom)}<small>${esc(subCuenta(c))}</small></span><span class="cat-i ${s < 0 ? 'mal' : ''}">${D(s)}</span></span></button>`; };

  }).join('');

/* ---- BLOQUEO ----
   Pantalla de privacidad: evita que otra persona abra la app. No cifra los datos del movil */
const CLAVE_PIN = 'mis-finanzas-pin';
const ITER_PIN = 120000, ESPERA_OLVIDO = 864e5;
let PIN = null, fueraDesde = 0;
const b64 = u => btoa(String.fromCharCode(...u));
const de64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
function cargaPin() {
  try { PIN = JSON.parse(localStorage.getItem(CLAVE_PIN) || 'null'); } catch (e) { PIN = null; }
  if (PIN && !(PIN.hash && PIN.sal && PIN.iter && window.crypto && crypto.subtle)) PIN = null;
}
function guardaPin() { try { PIN ? localStorage.setItem(CLAVE_PIN, JSON.stringify(PIN)) : localStorage.removeItem(CLAVE_PIN); } catch (e) {} }
async function huellaPin(pin, sal, iter) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  return b64(new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: de64(sal), iterations: iter}, k, 256)));
}
async function ponPin(pin) {
  const sal = b64(crypto.getRandomValues(new Uint8Array(16)));
  PIN = {...(PIN || {espera: 60000}), sal, iter: ITER_PIN, hash: await huellaPin(pin, sal, ITER_PIN), fallos: 0, hasta: 0, olvido: 0};
  guardaPin();
}
const biometriaDisponible = async () => {
  try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; }
};
async function creaBiometria() {
  const c = await navigator.credentials.create({publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)), rp: {name: 'Mis Finanzas'},
    user: {id: crypto.getRandomValues(new Uint8Array(16)), name: 'mis-finanzas', displayName: 'Mis Finanzas'},
    pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
    authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged'}, timeout: 60000, attestation: 'none'}});
  PIN.cred = b64(new Uint8Array(c.rawId)); guardaPin();
}
async function pideBiometria() {
  await navigator.credentials.get({publicKey: {challenge: crypto.getRandomValues(new Uint8Array(32)), timeout: 60000, userVerification: 'required',
    allowCredentials: [{type: 'public-key', id: de64(PIN.cred), transports: ['internal']}]}});
  return true;
}
/* modo: abrir, nuevo (elegir y repetir) o comprobar (pedir el actual, se puede cancelar) */
function abreCerrojo(modo) {
  return new Promise(res => {
    if ($('#cerrojo')) return res(false);
    const d = document.createElement('div');
    d.id = 'cerrojo'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', 'Bloqueo');
    const puede = modo !== 'abrir';
    d.innerHTML = `<div class="cj-c"><span class="cj-i">${I('lock-keyhole')}</span><h2 id="cj-t"></h2><p id="cj-s"></p><div class="cj-p" id="cj-p">${'<i></i>'.repeat(4)}</div></div>
      <div class="cj-t">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(k => k === '' ? (modo === 'abrir' && PIN && PIN.cred ? `<button aria-label="Usar Face ID" class="cj-k cj-bio" data-k="bio" type="button">${I('scan-face')}</button>` : '<span></span>') : `<button aria-label="${k === '⌫' ? 'Borrar cifra' : k}" class="cj-k" data-k="${k}" type="button">${k === '⌫' ? I('delete') : k}</button>`).join('')}</div>
      <button class="enlace cj-o" id="cj-o" type="button">${puede ? 'Cancelar' : '¿Has olvidado el PIN?'}</button>`;
    document.body.appendChild(d);
    let txt = '', primero = '', ocupado = false;
    const tit = $('#cj-t', d), sub = $('#cj-s', d), pun = $('#cj-p', d);
    const pinta = () => $$('i', pun).forEach((p, i) => p.classList.toggle('on', i < txt.length));
    const pon = (t, s = '') => { tit.textContent = t; sub.textContent = s; };
    const sal = v => { d.classList.add('fuera'); setTimeout(() => d.remove(), quieto ? 0 : 220); res(v); };
    const falla = msg => { txt = ''; pinta(); sub.textContent = msg; pun.classList.remove('tiembla'); void pun.offsetWidth; pun.classList.add('tiembla'); vibra(); };
    const bloqueado = () => PIN && PIN.hasta > Date.now();
    if (modo === 'nuevo') pon('Elige un PIN', 'Cuatro cifras que recuerdes');
    else if (modo === 'comprobar') pon('Tu PIN actual');
    else pon('Mis Finanzas', 'Introduce tu PIN');
    const compruebaOlvido = () => {
      if (modo !== 'abrir' || !PIN || !PIN.olvido) return;
      const r = PIN.olvido + ESPERA_OLVIDO - Date.now();
      if (r <= 0) { $('#cj-o', d).textContent = 'Entrar y quitar el PIN'; sub.textContent = 'Ya ha pasado la espera.'; }
      else sub.textContent = `El PIN se podrá quitar en ${Math.ceil(r / 36e5)} h. Si lo recuerdas, escríbelo.`;
    };
    compruebaOlvido();
    const valida = async () => {
      ocupado = true;
      try {
        if (modo === 'nuevo') {
          if (!primero) { primero = txt; txt = ''; pinta(); pon('Repite el PIN'); return; }
          if (primero !== txt) { primero = ''; pon('Elige un PIN'); falla('No coincidían. Prueba otra vez.'); return; }
          await ponPin(txt); sal(true); return;
        }
        if (await huellaPin(txt, PIN.sal, PIN.iter) === PIN.hash) { PIN.fallos = 0; PIN.hasta = 0; PIN.olvido = 0; guardaPin(); sal(true); return; }
        PIN.fallos = (PIN.fallos || 0) + 1;
        if (PIN.fallos % 5 === 0) PIN.hasta = Date.now() + 30000;
        guardaPin();
        falla(bloqueado() ? 'Demasiados intentos. Espera 30 segundos.' : 'PIN incorrecto.');
      } finally { ocupado = false; }
    };
    d.addEventListener('click', async e => {
      const b = e.target.closest('.cj-k');
      if (b) {
        const k = b.getAttribute('data-k');
        vibra();
        if (k === 'bio') { try { if (await pideBiometria()) { PIN.fallos = 0; guardaPin(); sal(true); } } catch (x) { sub.textContent = 'Face ID no ha funcionado. Usa tu PIN.'; } return; }
        if (ocupado) return;
        if (k === '⌫') { txt = txt.slice(0, -1); pinta(); return; }
        if (bloqueado()) return falla('Demasiados intentos. Espera 30 segundos.');
        if (txt.length >= 4) return;
        txt += k; pinta();
        if (txt.length === 4) setTimeout(valida, quieto ? 0 : 90);
        return;
      }
      if (e.target.closest('#cj-o')) {
        if (puede) return sal(false);
        if (PIN.olvido && Date.now() >= PIN.olvido + ESPERA_OLVIDO) { PIN = null; guardaPin(); return sal(true); }
        if (PIN.olvido) return compruebaOlvido();
        PIN.olvido = Date.now(); guardaPin(); compruebaOlvido();
      }
    });
  });
}
