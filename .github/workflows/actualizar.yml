name: Actualizar datos

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet requests beautifulsoup4 lxml

      - name: Comprobar que el script no rompe la pagina
        run: python update.py --selftest && git checkout -- index.html

      - name: Recoger datos reales
        run: python update.py

      - name: Publicar si algo cambio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos del $(date -u +%Y-%m-%d)"
            git push
          fi
