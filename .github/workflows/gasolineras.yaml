name: Gasolineras

on:
  schedule:
    - cron: "23 5,9,13,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gasolineras
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet requests

      - name: Comprobar el script
        run: python gasolineras.py --selftest

      - name: Leer precios del Ministerio
        run: python gasolineras.py

      # Rama aparte con un solo commit: no toca main, no se pisa con
      # actualizar.yml y no hace crecer el repositorio.
      - name: Publicar en la rama datos
        if: hashFiles('gasolineras.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir salida
          cp gasolineras.json salida/
          cd salida
          git init -q -b datos
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gasolineras.json
          git commit -q -m "Precios del $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
