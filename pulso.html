<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Pulso Cripto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: terminal de order flow — cabecera fija con vistas, tira de métricas de sesión, gráfico de precio con perfil de volumen y paneles apilados; vista Indicadores como briefing por secciones */
:root{
  --bg:#07070c; --panel:#0e0e16; --raised:#16152a; --line:#1f1d33; --grid:#12111d;
  --fg:#e6e4f2; --muted:#8b88a3; --accent:#8f7dff; --accent-2:#5ad1ff;
  --up:#2fc792; --down:#ef5a6a; --warn:#f0be4f;
  --ema20:#b59cff; --ema50:#5ad1ff; --ema200:#f2a541; --bb:#6c6a86;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 32px}
@media (min-width:600px){body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.07em;line-height:1;white-space:nowrap}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{background:none;border:0;padding:7px 12px;border-radius:6px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--fg);box-shadow:inset 0 0 0 1px #2e2a52}
.mkt{display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid #2e2a52;border-radius:8px;padding:6px 10px}
.mkt b{font-family:var(--f-mono);font-weight:600;font-size:13px}
.mkt svg{width:14px;height:14px;opacity:.7}
.right{margin-left:auto;display:flex;align-items:center;gap:14px}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.clock small,.lbl{font-family:var(--f-display);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.clock b{font-family:var(--f-mono);font-weight:500;font-size:14px;color:var(--accent-2);font-variant-numeric:tabular-nums}
.src{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--up);animation:pulse 2s infinite}
.dot.poll{background:var(--warn)} .dot.off{background:var(--down)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,199,146,.6)}70%{box-shadow:0 0 0 7px rgba(47,199,146,0)}100%{box-shadow:0 0 0 0 rgba(47,199,146,0)}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}
@media (max-width:560px){.src span:last-child{display:none}.clock small{display:none}}

/* tira de sesión */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:12px}
.kv{display:flex;align-items:baseline;gap:6px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.kv span{color:var(--muted)}
.price{font-family:var(--f-mono);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.chg{font-family:var(--f-mono);font-size:13px}
.up{color:var(--up)} .down{color:var(--down)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{background:none;border:0;padding:5px 9px;border-radius:5px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.btn em{font-style:normal;background:var(--accent);color:#0b0820;border-radius:10px;padding:0 6px;font-size:10px;font-weight:600}

/* gráficos */
.charts{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pane{position:relative;background:var(--panel)}
.cv{width:100%}
.cv.main{height:min(62vh,520px);min-height:300px}
.cv.sub{height:96px}
.maxed .cv.main{height:min(80vh,760px)}
.ov{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.hm{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
.pane>.cv{position:relative;z-index:1}
.btn b{font-weight:600}
.dom{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.domhd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.domhd div{min-width:0}
.domhd b{display:block;font-family:var(--f-mono);font-weight:600;font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
.dcols,.dr{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr) minmax(0,1fr)}
@media (max-width:420px){.dcols,.dr{grid-template-columns:minmax(0,1fr) 80px minmax(0,1fr) minmax(0,1fr)}.domhd{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dcols{padding:8px 0;border-bottom:1px solid var(--line)}
.dcols span{text-align:center}
.dr{height:26px;border-top:1px solid var(--grid);font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.dr span{position:relative;display:flex;align-items:center;padding:0 8px;min-width:0;overflow:hidden}
.dr i{position:absolute;top:3px;bottom:3px;border-radius:2px}
.dr b{position:relative;font-weight:500}
.dr .bid{justify-content:flex-end}.dr .bid i{right:0;background:rgba(47,199,146,.28)}
.dr .ask i{left:0;background:rgba(239,90,106,.28)}
.dr .vol i{left:0;background:rgba(143,125,255,.25)}
.dr .px{justify-content:center;background:var(--raised);color:var(--fg)}
.dr.cur .px{background:var(--accent);color:#0b0820;font-weight:600}
.dr.big .bid b,.dr.big .ask b{font-weight:700;color:#fff}
.domnote{padding:40px 16px;text-align:center;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.state{font-size:13px;color:var(--muted);white-space:nowrap}
.row[aria-pressed="true"] .state{color:var(--fg)}
.legend{position:absolute;top:7px;left:10px;right:72px;z-index:3;pointer-events:none;display:flex;flex-wrap:wrap;gap:3px 12px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.legend b{font-weight:500;color:var(--fg)}
.legend .tag{font-family:var(--f-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);z-index:4;pointer-events:none;text-align:center;padding:20px}
.foot{display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:10px;font-size:11.5px;color:var(--muted)}
.foot i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}

/* hojas inferiores */
.scrim{position:fixed;inset:0;background:rgba(3,2,10,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:82vh;overflow:auto;background:var(--panel);border:1px solid #2a2746;border-bottom:0;border-radius:16px 16px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:620px;margin-inline:auto}
.sheet::before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:#3b3760;margin:2px auto 12px}
.sheet h3{margin:0 0 12px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sheet h3 em{font-style:normal;font-family:var(--f-mono);font-size:11px;letter-spacing:0;border:1px solid #3b3760;border-radius:10px;padding:1px 8px;color:var(--muted)}
.row{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-top:1px solid var(--line);padding:12px 4px;text-align:left}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px}
.row .t small{color:var(--muted);font-size:12.5px}
.row .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.row .v small{display:block;font-size:12px}
.row[aria-pressed="true"]{background:linear-gradient(90deg,rgba(143,125,255,.14),transparent);box-shadow:inset 3px 0 0 var(--accent)}
.check{width:20px;height:20px;border-radius:5px;border:1px solid #3b3760;display:grid;place-items:center;flex:none}
.row[aria-pressed="true"] .check{background:var(--accent);border-color:var(--accent)}
.row[aria-pressed="true"] .check::after{content:"";width:9px;height:5px;border-left:2px solid #0b0820;border-bottom:2px solid #0b0820;transform:rotate(-45deg) translate(1px,-1px)}
.search{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--fg);font:inherit;margin-bottom:6px}
.icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--raised);border:1px solid #2a2746;font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--accent);flex:none}

/* indicadores */
.ind{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.hero{background:radial-gradient(120% 140% at 0% 0%,rgba(143,125,255,.18),transparent 55%),var(--panel);border:1px solid #2a2746;border-radius:14px;padding:18px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.hero h1{margin:6px 0 6px;font-family:var(--f-body);font-weight:700;font-size:clamp(22px,4.5vw,30px);text-wrap:balance}
.hero h1 span{color:var(--muted);font-weight:500}
.hero p{margin:0;color:var(--muted);max-width:62ch;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px}
.chip b{display:block;font-family:var(--f-mono);font-weight:500;font-size:15px}
.chip small{font-family:var(--f-display);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sec>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:15px 16px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .num{font-family:var(--f-mono);color:var(--accent);font-size:14px}
.sec>summary h2{margin:0;flex:1;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.sec[open]>summary::after{transform:rotate(-135deg)}
.sec>summary+*{border-top:1px solid var(--line)}
.body{padding:16px;display:flex;flex-direction:column;gap:14px}
.help{border:1px solid #2e2a52;border-radius:9px;background:rgba(143,125,255,.06)}
.help summary{padding:8px 12px;font-size:13px;font-weight:600;color:#c9c1ff}
.help p{margin:0;padding:0 12px 12px;color:var(--muted);font-size:13px;line-height:1.55}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.cards.c4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:13px;min-width:0}
.card .lbl{display:block;margin-bottom:6px}
.card .big{font-family:var(--f-mono);font-weight:600;font-size:clamp(17px,3.6vw,22px);font-variant-numeric:tabular-nums;line-height:1.2}
.card .big.word{color:#c9c1ff}
.card .sub{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.4}
.guide{display:flex;flex-direction:column}
.g{padding:14px 0;border-top:1px solid var(--line)}
.g:first-child{border-top:0;padding-top:0}
.g .h{display:flex;align-items:center;gap:8px}
.g .h i{width:8px;height:8px;border-radius:50%}
.pill{display:inline-block;margin:9px 0 7px;padding:3px 11px;border-radius:999px;font-weight:600;font-size:13.5px;border:1px solid}
.pill.bull{color:var(--up);border-color:rgba(47,199,146,.4);background:rgba(47,199,146,.1)}
.pill.bear{color:var(--down);border-color:rgba(239,90,106,.4);background:rgba(239,90,106,.1)}
.pill.warn{color:var(--warn);border-color:rgba(240,190,79,.4);background:rgba(240,190,79,.1)}
.pill.neu{color:var(--fg);border-color:#34314f;background:var(--raised)}
.g p{margin:0;color:var(--muted);line-height:1.55;max-width:66ch}
.perf{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.perf div{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.perf b{display:inline-block;margin-top:4px;font-family:var(--f-mono);font-weight:600;font-size:16px;padding:1px 6px;border-radius:4px}
.perf b.up{background:rgba(47,199,146,.12)} .perf b.down{background:rgba(239,90,106,.12)}
.rng{display:flex;flex-direction:column;gap:6px}
.rng .hd{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.rng .hd span{color:var(--muted)}
.rng .hd b{font-family:var(--f-mono);font-weight:500;font-size:12.5px}
.bar{position:relative;height:7px;border-radius:4px;background:linear-gradient(90deg,#7b2b3a,#3a2c45 50%,#1f6b52)}
.bar i{position:absolute;top:-5px;width:5px;height:17px;border-radius:2px;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 2px var(--panel)}
.rng .ft{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.meter{height:7px;border-radius:4px;background:var(--raised);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.cv.daily{height:340px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.warnbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
.warnbox button{background:var(--accent);color:#0b0820;border:0;border-radius:6px;padding:6px 12px;font-weight:600}
</style>

<header class="top">
  <div class="brand">PULSO<span>·</span>CRIPTO</div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabChart" aria-selected="true" type="button">Gráfico</button>
    <button role="tab" id="tabInd" aria-selected="false" type="button">Indicadores</button>
  </div>
  <button class="mkt" id="mktBtn" type="button" aria-label="Cambiar mercado"><b id="mktSym">BTCUSDT</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
  <div class="right">
    <div class="src"><span class="dot" id="dot"></span><span id="srcTxt">Conectando…</span></div>
    <div class="clock"><small>Tu hora</small><b id="clock">--:--:--</b></div>
  </div>
</header>

<div class="warnbox" id="msg" hidden></div>

<!-- VISTA GRÁFICO -->
<section id="viewChart">
  <div class="strip">
    <div class="kv"><span>Δ</span><b id="sDelta">—</b></div>
    <div class="kv"><span>POC</span><b id="sPoc" style="color:var(--warn)">—</b></div>
    <div class="kv"><span>VWAP</span><b id="sVwap" style="color:var(--accent)">—</b></div>
    <div class="kv"><span>VOL</span><b id="sVol">—</b></div>
    <span class="price" id="sPrice">—</span><span class="chg" id="sChg"></span>
    <div class="ctrl">
      <div class="seg" id="tfs" aria-label="Temporalidad"></div>
      <button class="btn" id="modeBtn" type="button">Vista: <b id="modeName">Precio</b></button>
      <button class="btn" id="indBtn" type="button">Indicadores <em id="indCount">4/9</em></button>
      <button class="btn" id="panelBtn" type="button">Paneles <em id="panelCount">4/6</em></button>
    </div>
  </div>
  <div class="charts" id="charts">
    <div class="pane"><canvas class="hm" id="hm"></canvas><div class="legend" id="lgMain"></div><div class="empty" id="empty">Cargando velas…</div><div class="cv main" id="cMain"></div><canvas class="ov" id="ov"></canvas></div>
  </div>
  <div class="dom" id="dom" hidden></div>
  <div class="foot" id="foot"></div>
</section>

<!-- VISTA INDICADORES -->
<section id="viewInd" hidden>
  <div class="ind" id="ind"></div>
</section>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheetPanels" hidden role="dialog" aria-label="Paneles del gráfico">
  <h3>Paneles del gráfico <em id="pcount">6</em></h3>
  <div id="panelRows"></div>
  <div class="lbl" style="margin:14px 0 4px">Tamaño</div>
  <button class="row" type="button" id="maxBtn" aria-pressed="false"><span class="check"></span><span class="t"><b>Maximizar el gráfico de precio</b><small>El precio ocupa la pantalla y se ocultan los paneles</small></span></button>
  <button class="row" type="button" id="resetBtn"><span class="icon">↺</span><span class="t"><b>Restablecer paneles</b><small>Vuelve a la configuración inicial</small></span></button>
</div>
<div class="sheet" id="sheetMode" hidden role="dialog" aria-label="Vista del gráfico">
  <h3>Vista del gráfico <em>5</em></h3>
  <div id="modeRows"></div>
</div>
<div class="sheet" id="sheetInd" hidden role="dialog" aria-label="Indicadores del gráfico">
  <h3>Indicadores del gráfico <em>9</em></h3>
  <div class="lbl" style="margin:0 0 6px">Pulsa para activar o apagar</div>
  <div class="note" id="indNote" hidden style="margin-bottom:8px"></div>
  <div id="indRows"></div>
</div>
<div class="sheet" id="sheetMkt" hidden role="dialog" aria-label="Mercados">
  <h3>Mercados <em id="mcount"></em></h3>
  <input class="search" id="mSearch" type="search" placeholder="Buscar par…" autocomplete="off">
  <div id="mktRows"></div>
</div>

<script>
(function(){
const SRCS=["https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js","https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"];
function fail(t){const e=document.getElementById("empty");if(e){e.hidden=false;e.textContent=t;}}
function boot(){try{start();}catch(err){fail("Error al iniciar: "+(err&&err.message||err));}}
function load(i){if(window.LightweightCharts)return boot();if(i>=SRCS.length)return fail("No se pudo cargar la librería de gráficos.");const s=document.createElement("script");s.src=SRCS[i];s.onload=()=>window.LightweightCharts?boot():load(i+1);s.onerror=()=>load(i+1);document.head.appendChild(s);}

function emaN(v,p){const idx=v.findIndex(x=>x!=null);const o=new Array(v.length).fill(null);if(idx<0)return o;ema(v.slice(idx),p).forEach((x,i)=>o[i+idx]=x);return o;}
function sma(v,p){const o=new Array(v.length).fill(null);let s=0;for(let i=0;i<v.length;i++){s+=v[i];if(i>=p)s-=v[i-p];if(i>=p-1)o[i]=s/p;}return o;}
function boll(v,p,m){const mid=sma(v,p),u=[],l=[];for(let i=0;i<v.length;i++){if(mid[i]==null){u.push(null);l.push(null);continue;}let q=0;for(let j=i-p+1;j<=i;j++)q+=(v[j]-mid[i])**2;const sd=Math.sqrt(q/p);u.push(mid[i]+m*sd);l.push(mid[i]-m*sd);}return{mid,u,l};}
function rsi(v,p){const o=new Array(v.length).fill(null);if(v.length<=p)return o;let g=0,L=0;for(let i=1;i<=p;i++){const d=v[i]-v[i-1];d>0?g+=d:L-=d;}g/=p;L/=p;o[p]=L===0?100:100-100/(1+g/L);for(let i=p+1;i<v.length;i++){const d=v[i]-v[i-1];g=(g*(p-1)+Math.max(d,0))/p;L=(L*(p-1)+Math.max(-d,0))/p;o[i]=L===0?100:100-100/(1+g/L);}return o;}

/* ======================= cálculo order flow ======================= */
function anchorStart(t){const tf=TFS.find(x=>x.l===st.tf);const d=new Date(t*1000);let s=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())/1000;if(tf.anchor==="week"){const wd=(d.getUTCDay()+6)%7;s-=wd*86400;}if(tf.anchor==="month")s=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)/1000;return s;}
const tfSec=()=>TFS.find(t=>t.l===st.tf).s;
function on(k){if(st.mode==="dom")return false;if(st.mode==="signals")return k==="road";return !!st.ind[k];}
function niceStep(x){if(!(x>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p;return p*(m<1.5?1:m<2.25?2:m<3.75?2.5:m<7.5?5:10);}
function flow(){
  const n=candles.length;if(!n)return null;
  const a0=anchorStart(candles[n-1].t);let ai=candles.findIndex(c=>c.t>=a0);if(ai<0)ai=0;
  const delta=candles.map(c=>2*c.bv-c.v);
  const vwap=new Array(n).fill(null),vu=[...vwap],vl=[...vwap],cvd=[...vwap],dev=[...vwap];
  let pv=0,vv=0,pv2=0,cd=0,sv=0;
  for(let i=ai;i<n;i++){const c=candles[i],tp=(c.h+c.l+c.c)/3;pv+=tp*c.v;vv+=c.v;pv2+=tp*tp*c.v;cd+=delta[i];sv+=c.v;
    if(vv>0){const w=pv/vv,sd=Math.sqrt(Math.max(0,pv2/vv-w*w));vwap[i]=w;vu[i]=w+sd;vl[i]=w-sd;dev[i]=sd>0?(c.c-w)/sd:0;}cvd[i]=cd;}
  // perfil de volumen de sesión
  let lo=Infinity,hi=-Infinity;for(let i=ai;i<n;i++){lo=Math.min(lo,candles[i].l);hi=Math.max(hi,candles[i].h);}
  const NB=56,step=(hi-lo)/NB||1,bins=Array.from({length:NB},(_,k)=>({lo:lo+k*step,hi:lo+(k+1)*step,b:0,s:0}));
  for(let i=ai;i<n;i++){const c=candles[i];const k0=Math.max(0,Math.floor((c.l-lo)/step)),k1=Math.min(NB-1,Math.floor((c.h-lo)/step));const m=k1-k0+1;for(let k=k0;k<=k1;k++){bins[k].b+=c.bv/m;bins[k].s+=(c.v-c.bv)/m;}}
  let poc=0;bins.forEach((b,k)=>{if(b.b+b.s>bins[poc].b+bins[poc].s)poc=k;});
  const tot=bins.reduce((s,b)=>s+b.b+b.s,0);let va=bins[poc].b+bins[poc].s,lk=poc,hk=poc;
  while(va<tot*.7&&(lk>0||hk<NB-1)){const dn=lk>0?bins[lk-1].b+bins[lk-1].s:-1,upv=hk<NB-1?bins[hk+1].b+bins[hk+1].s:-1;if(upv>=dn){hk++;va+=upv;}else{lk--;va+=dn;}}
  bins.forEach((b,k)=>{b.va=k>=lk&&k<=hk;b.poc=k===poc;});
  // velas de volumen extremo y desequilibrios
  const look=candles.slice(-300).map(c=>c.v);const[vm,vs]=meanSd(look);
  const bigs=[];candles.forEach((c,i)=>{const z=vs?(c.v-vm)/vs:0;if(z>2.6)bigs.push({t:c.t,p:(c.h+c.l+c.c)/3,z,v:c.v,buy:delta[i]>=0});});
  const[dm,ds]=meanSd(delta.slice(-300));
  const markers=[];candles.forEach((c,i)=>{if(!ds)return;const z=(delta[i]-dm)/ds;if(z>2.3)markers.push({time:c.t+TZ,position:"belowBar",color:UP,shape:"arrowUp",size:.6});else if(z<-2.3)markers.push({time:c.t+TZ,position:"aboveBar",color:DN,shape:"arrowDown",size:.6});});
  // divergencias de delta
  const div=new Array(n).fill(null),LB=20;
  for(let i=Math.max(ai+LB,LB);i<n;i++){let mh=-Infinity,ml=Infinity,ch=-Infinity,cl=Infinity;for(let j=i-LB;j<i;j++){mh=Math.max(mh,candles[j].h);ml=Math.min(ml,candles[j].l);if(cvd[j]!=null){ch=Math.max(ch,cvd[j]);cl=Math.min(cl,cvd[j]);}}
    if(candles[i].h>=mh&&cvd[i]<ch)div[i]=-1;else if(candles[i].l<=ml&&cvd[i]>cl)div[i]=1;}
  return{ai,delta,vwap,vu,vl,cvd,dev,bins,poc:(bins[poc].lo+bins[poc].hi)/2,vah:bins[hk].hi,val:bins[lk].lo,bigs,markers,div,sessDelta:cd,sessVol:sv};
}

function supert(c,p,m){const n=c.length,a=atr(c,p),dir=new Array(n).fill(null),line=new Array(n).fill(null);let fu=null,fl=null,d=1;
  for(let i=0;i<n;i++){if(a[i]==null)continue;const hl=(c[i].h+c[i].l)/2,bu=hl+m*a[i],bl=hl-m*a[i],pc=i?c[i-1].c:c[i].c;
    const nu=(fu==null||bu<fu||pc>fu)?bu:fu,nl=(fl==null||bl>fl||pc<fl)?bl:fl;
    if(d===1&&c[i].c<nl)d=-1;else if(d===-1&&c[i].c>nu)d=1;fu=nu;fl=nl;dir[i]=d;line[i]=d===1?nl:nu;}
  return{dir,line,atr:a};}
function roadCalc(t){

  const sq=C.map((_,i)=>bb.u[i]!=null&&a20[i]!=null&&(bb.u[i]-bb.l[i])<3*a20[i]);
  const markers=[];let tgt=null,td=0;

    try{const a=await (await fetch("https://api.binance.com/api/v3/ticker/24hr?symbols="+encodeURIComponent(JSON.stringify(sp.map(x=>x.bn))))).json();a.forEach(x=>{const S=sp.find(y=>y.bn===x.symbol);if(S)mkt[S.id]={p:+x.lastPrice,c:+x.priceChangePercent};});drawMkts();}catch(e){}
    SYMS.filter(x=>x.fut).forEach(S=>fetch(FAPI+"ticker/24hr?symbol="+S.bn).then(r=>r.json()).then(x=>{mkt[S.id]={p:+x.lastPrice,c:+x.priceChangePercent};drawMkts();}).catch(()=>{}));
    SYMS.filter(x=>x.hl).forEach(S=>hlInfo({type:"candleSnapshot",req:{coin:S.hl,interval:"1d",startTime:Date.now()-4*864e5,endTime:Date.now()}}).then(a=>{if(a.length>1){const l=+a[a.length-1].c,pv=+a[a.length-2].c;mkt[S.id]={p:l,c:(l/pv-1)*100};drawMkts();}}).catch(()=>{}));
  }
  if(m){SYMS.filter(S=>!extOk).forEach(S=>{const s=S.id;m.callTool(SERVER,"get_ticker",{instrument_name:S.cdc},{cache:{staleTime:30000}}).then(r=>{const p=r.payload||{};const k=S.scale||1,mid=+p.best_bid&&+p.best_ask?(+p.best_bid+ +p.best_ask)/2:+p.last;mkt[s]={p:mid*k,c:+p.change*100};if(!$("sheetMkt").hidden)drawMkts();}).catch(()=>{});});}
}
setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit",second:"2-digit"});},1000);
function setSrc(k,t){$("dot").className="dot "+k;$("srcTxt").textContent=t;}
function msg(text,btn,fn){const m=$("msg");if(!text){m.hidden=true;return;}m.innerHTML="";const s=document.createElement("span");s.textContent=text;m.appendChild(s);if(btn){const b=document.createElement("button");b.type="button";b.textContent=btn;b.onclick=fn;m.appendChild(b);}m.hidden=false;}
let lastPx=null,last24c=null;
function quote(p,c){
  if(p!=null&&isFinite(p))lastPx=p;if(c!=null&&isFinite(c))last24c=c;
  if(lastPx!=null)$("sPrice").textContent=fp(lastPx);
  let pc=last24c,ab=null;
  if(SY().session&&daily.length>1&&lastPx!=null){const pv=daily[daily.length-2].c;ab=lastPx-pv;pc=(lastPx/pv-1)*100;}
  else if(lastPx!=null&&pc!=null)ab=lastPx-lastPx/(1+pc/100);
  if(pc!=null){$("sChg").textContent=(ab!=null?(ab>=0?"+":"")+nf(ab,lastPx>=1?2:6)+"  ":"")+fpct(pc);$("sChg").className="chg "+cls(pc);}
}

/* ======================= fuentes externas: Binance (spot y futuros) e Hyperliquid ======================= */
const SPOT="https://api.binance.com/api/v3/",FAPI="https://fapi.binance.com/fapi/v1/",HL="https://api.hyperliquid.xyz/info";
let extOk=null;
let adj=0,indT=0;
function renderIndThrottled(){const now=Date.now();if(now-indT>10000){indT=now;renderInd();}}
const sh=(c,d)=>{c.o+=d;c.h+=d;c.l+=d;c.c+=d;return c;};
function setAdj(n){if(!isFinite(n))return;const d=n-adj;if(Math.abs(d)<1e-9)return;candles.forEach(c=>sh(c,d));daily.forEach(c=>sh(c,d));if(lastPx!=null)lastPx+=d;adj=n;renderChart();quote(null,null);if(st.view==="ind")renderIndThrottled();}
function stop(){gen++;resetFlow();adj=0;lastPx=null;last24c=null;$("sChg").textContent="";if(ws){try{ws.onclose=null;ws.close();}catch(e){}ws=null;}unwatch.forEach(u=>{try{u();}catch(e){}});unwatch=[];timers.forEach(clearInterval);timers=[];tradeBook=new Map();}
const kl=x=>({t:x[0]/1000,o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5],bv:+x[9],n:+x[8]});
const base=()=>SY().fut?FAPI:SPOT;
async function bjson(u,signal){const r=await fetch(base()+u,{signal});if(!r.ok)throw new Error(r.status);return r.json();}
async function hlInfo(body,signal){const r=await fetch(HL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal});if(!r.ok)throw new Error(r.status);return r.json();}
async function binanceDaily(g){
  const sym=SY().bn;const a=await bjson("klines?symbol="+sym+"&interval=1d&limit=1000");let all=a;
  if(a.length===1000){try{const b=await bjson("klines?symbol="+sym+"&interval=1d&limit=1000&endTime="+(a[0][0]-1));all=b.concat(a);}catch(e){}}
  if(g!==gen)return;daily=all.map(x=>sh(kl(x),adj));quote(null,null);if(st.view==="ind")renderInd();
}
function liveLoop(g){let dirty=false;timers.push(setInterval(()=>{if(dirty&&g===gen){dirty=false;renderChart();}},1000));return()=>{dirty=true;};}
function upsert(c){const lst=candles[candles.length-1];if(lst&&lst.t===c.t)candles[candles.length-1]=c;else if(!lst||c.t>lst.t){candles.push(c);if(candles.length>1500)candles.shift();}}
async function binanceIntraday(g){
  const S=SY(),sym=S.bn,tf=st.tf,ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);
  const tfS=TFS.find(t=>t.l===tf).s;const need=Math.min(1000,Math.ceil((Date.now()/1000-anchorStart(Date.now()/1000))/tfS)+300);
  const [k,tk]=await Promise.all([bjson("klines?symbol="+sym+"&interval="+tf+"&limit="+Math.max(400,need),ctl.signal),bjson("ticker/24hr?symbol="+sym,ctl.signal)]);clearTimeout(to);
  if(g!==gen)return;
  candles=k.map(kl);setStep();renderChart();quote(+tk.lastPrice,+tk.priceChangePercent);
  if(S.fut){const pi=async()=>{try{const x=await bjson("premiumIndex?symbol="+sym);if(g===gen&&+x.indexPrice>0&&+x.markPrice>0)setAdj(+x.indexPrice-+x.markPrice);}catch(e){}};await pi();timers.push(setInterval(pi,15000));}
  src="binance";applyPanels();setSrc("live",(S.fut?"Binance · ajustado a spot":"Binance · tiempo real"));msg(null);
  const mark=liveLoop(g),s=sym.toLowerCase();
  ws=new WebSocket((S.fut?"wss://fstream.binance.com":"wss://stream.binance.com:9443")+"/stream?streams="+s+"@kline_"+tf+"/"+s+"@ticker/"+s+"@aggTrade");
  ws.onmessage=e=>{if(g!==gen)return;const d=JSON.parse(e.data).data;
    if(d.e==="kline"){const K=d.k;upsert(sh({t:K.t/1000,o:+K.o,h:+K.h,l:+K.l,c:+K.c,v:+K.v,bv:+K.V,n:+K.n},adj));mark();}
    else if(d.e==="24hrTicker")quote(+d.c+adj,+d.P);
    else if(d.e==="aggTrade")addTrade(d.T/1000,+d.p,+d.q,!d.m,d.a);};
  ws.onclose=()=>{if(g!==gen)return;setSrc("off","Conexión perdida · reintentando");setTimeout(()=>{if(g===gen)loadIntraday();},4000);};
  binanceDaily(g).catch(()=>{});timers.push(setInterval(()=>binanceDaily(g).catch(()=>{}),300000));
  const pollBook=async()=>{try{const d=await bjson("depth?symbol="+sym+"&limit=1000");if(g===gen)onBook(d.bids.map(x=>[+x[0],+x[1]]),d.asks.map(x=>[+x[0],+x[1]]));}catch(e){}};
  pollBook();timers.push(setInterval(pollBook,2500));
  backfillTrades(g,S);
}
async function backfillTrades(g,S){
  try{let all=await bjson("aggTrades?symbol="+S.bn+"&limit=1000");const want=((candles[Math.max(0,candles.length-60)]||{}).t||0)*1000;let n=0;const max=S.fut?8:20;
    while(all.length&&all[0].T>want&&n<max&&g===gen){const from=all[0].a-1000;if(from<0)break;const r=await bjson("aggTrades?symbol="+S.bn+"&fromId="+from+"&limit=1000");if(!r.length)break;const first=all[0].a;all=r.filter(x=>x.a<first).concat(all);n++;}
    if(g!==gen)return;all.forEach(x=>addTrade(x.T/1000,+x.p,+x.q,!x.m,x.a));setFoot();
  }catch(e){}
}
/* Hyperliquid: velas sin volumen comprador, así que el delta se reparte por la dirección de la vela y se corrige con las operaciones en vivo */
function hlC(x){const t=x.t/1000,o=+x.o,h=+x.h,l=+x.l,c=+x.c,v=+x.v;const tb=tradeBook.get(t);const bv=tb&&tb.b+tb.s>0?v*tb.b/(tb.b+tb.s):v*(0.5+0.5*(h>l?(c-o)/(h-l):0));return{t,o,h,l,c,v,bv,n:x.n!=null?+x.n:null};}
async function hlDaily(g){
  const a=await hlInfo({type:"candleSnapshot",req:{coin:SY().hl,interval:"1d",startTime:Date.now()-1200*864e5,endTime:Date.now()}});
  if(g!==gen)return;daily=a.map(hlC);quote(null,null);if(st.view==="ind")renderInd();
}
async function hlIntraday(g){
  const S=SY(),tf=st.tf,tfS=TFS.find(t=>t.l===tf).s,ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);
  const start=Math.min(anchorStart(Date.now()/1000)*1000,Date.now()-400*tfS*1000);
  const a=await hlInfo({type:"candleSnapshot",req:{coin:S.hl,interval:tf,startTime:start,endTime:Date.now()}},ctl.signal);clearTimeout(to);
  if(g!==gen)return;if(!a||!a.length)throw new Error("sin velas");
  candles=a.map(hlC);setStep();renderChart();quote(candles[candles.length-1].c,null);
  src="hl";applyPanels();setSrc("live","Hyperliquid · tiempo real");msg(null);
  const mark=liveLoop(g);
  ws=new WebSocket("wss://api.hyperliquid.xyz/ws");
  ws.onopen=()=>{ws.send(JSON.stringify({method:"subscribe",subscription:{type:"candle",coin:S.hl,interval:tf}}));ws.send(JSON.stringify({method:"subscribe",subscription:{type:"trades",coin:S.hl}}));ws.send(JSON.stringify({method:"subscribe",subscription:{type:"l2Book",coin:S.hl,nSigFigs:5}}));};
  ws.onmessage=e=>{if(g!==gen)return;const m=JSON.parse(e.data);
    if(m.channel==="candle"){upsert(hlC(m.data));quote(+m.data.c,null);mark();}
    else if(m.channel==="l2Book"&&m.data&&m.data.levels){onBook(m.data.levels[0].map(x=>[+x.px,+x.sz]),m.data.levels[1].map(x=>[+x.px,+x.sz]));}
    else if(m.channel==="trades"){(m.data||[]).forEach(x=>{addTrade(x.time/1000,+x.px,+x.sz,x.side==="B",x.tid);const b=Math.floor(x.time/1000/tfS)*tfS;const o=tradeBook.get(b)||{b:0,s:0};x.side==="B"?o.b+=+x.sz:o.s+=+x.sz;tradeBook.set(b,o);const lc=candles[candles.length-1];if(lc&&lc.t===b){const t=tradeBook.get(b);lc.bv=lc.v*t.b/(t.b+t.s||1);}});mark();}};
  ws.onclose=()=>{if(g!==gen)return;setSrc("off","Conexión perdida · reintentando");setTimeout(()=>{if(g===gen)loadIntraday();},4000);};
  timers.push(setInterval(()=>{try{ws&&ws.readyState===1&&ws.send(JSON.stringify({method:"ping"}));}catch(e){}},45000));
  hlDaily(g).catch(()=>{});timers.push(setInterval(()=>hlDaily(g).catch(()=>{}),300000));
}

/* ======================= fuente: conector Crypto.com ======================= */
let mcpP;try{mcpP=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use("mcp")).catch(()=>null):Promise.resolve(null);}catch(e){mcpP=Promise.resolve(null);}
function mcpErr(e,g){
  if(g!==gen)return;const c=e&&e.code;
  if(c==="server_not_connected"||c==="selection_required"||c==="server_not_found"){candles=[];renderChart();setSrc("off","Sin conector");msg("Añade el conector Crypto.com en claude.ai → Ajustes → Conectores para ver los gráficos aquí.");}
  else if(c==="needs_reauth"){setSrc("off","Reconectar");msg("Reconecta Crypto.com en claude.ai → Ajustes → Conectores.");}
  else if(c==="approval_required"||c==="not_in_manifest"||c==="consent_required"){setSrc("off","Falta permiso");msg("La página necesita tu permiso para leer precios de Crypto.com.","Permitir",()=>{mcpP.then(m=>m&&m.callTool(SERVER,"get_ticker",{instrument_name:SY().cdc})).then(()=>loadAll()).catch(()=>{});});}
  else if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed")noData();
  else{setSrc("poll","Datos sin actualizar");}
}
function cdcRows(ev){const p=ev.result.payload||{};return p.data||(p.result&&p.result.data)||[];}
function cdcCandles(rows,tfS){
  const k=SY().scale||1;
  return rows.map(x=>{const t=Date.parse(x.timestamp)/1000,o=x.open*k,h=x.high*k,l=x.low*k,c=x.close*k,v=+x.volume;
    const tb=tradeBook.get(t);let bv;
    if(tb&&tb.b+tb.s>0)bv=v*tb.b/(tb.b+tb.s);else bv=v*(0.5+0.5*(h>l?(c-o)/(h-l):0));
    return{t,o,h,l,c,v,bv,n:null};}).filter(x=>isFinite(x.t)).sort((a,b)=>a.t-b.t);
}
let rawRows=[];
async function cdcIntraday(g){
  const m=await mcpP;if(g!==gen)return;if(!m){noData();return;}
  src="cdc";applyPanels();setSrc("poll","Crypto.com · cada 30 s");
  const inst=SY().cdc,tfS=TFS.find(t=>t.l===st.tf).s,seen=new Set();
  unwatch.push(m.watchTool(SERVER,"get_candlestick",{instrument_name:inst,timeframe:st.tf},ev=>{
    if(g!==gen)return;if(ev.type==="error")return mcpErr(ev.error,g);
    rawRows=cdcRows(ev);candles=cdcCandles(rawRows,tfS);setStep();renderChart();msg(null);setSrc("poll","Crypto.com · cada 30 s");
  },{refetchInterval:30000}));
  unwatch.push(m.watchTool(SERVER,"get_trades",{instrument_name:inst,count:150},ev=>{
    if(g!==gen||ev.type!=="data")return;
    cdcRows(ev).forEach(x=>{const key=x.timestamp+x.price+x.qty+x.side;if(seen.has(key))return;seen.add(key);const b=Math.floor(Date.parse(x.timestamp)/1000/tfS)*tfS;const o=tradeBook.get(b)||{b:0,s:0};x.side==="buy"?o.b+=+x.qty:o.s+=+x.qty;tradeBook.set(b,o);});
    if(rawRows.length){candles=cdcCandles(rawRows,tfS);renderChart();}
  },{refetchInterval:30000}));
  unwatch.push(m.watchTool(SERVER,"get_ticker",{instrument_name:inst},ev=>{
    if(g!==gen||ev.type!=="data")return;const q=ev.result.payload||{};const k=SY().scale||1,mid=+q.best_bid&&+q.best_ask?(+q.best_bid+ +q.best_ask)/2*k:q.last*k;quote(mid,+q.change*100);
    const lc=candles[candles.length-1];if(SY().scale&&lc&&isFinite(mid)){lc.c=mid;lc.h=Math.max(lc.h,mid);lc.l=Math.min(lc.l,mid);renderChart();}
  },{refetchInterval:30000}));
}
async function cdcDaily(g){
  const m=await mcpP;if(g!==gen||!m)return;
  unwatch.push(m.watchTool(SERVER,"get_candlestick",{instrument_name:SY().cdc,timeframe:"1D"},ev=>{
    if(g!==gen||ev.type!=="data")return;
    const k=SY().scale||1;daily=cdcRows(ev).map(x=>({t:Date.parse(x.timestamp)/1000,o:x.open*k,h:x.high*k,l:x.low*k,c:x.close*k,v:+x.volume})).filter(x=>isFinite(x.t)).sort((a,b)=>a.t-b.t);
    quote(null,null);if(st.view==="ind")renderInd();
  },{refetchInterval:120000}));
}
function noData(){candles=[];setSrc("off","Sin fuente de datos");$("empty").hidden=false;$("empty").textContent="Sin conexión a datos";msg(!(window.claude&&window.claude.use)?"Esta vista previa no deja conectar con los mercados. Abre la página desde iiyxeil.github.io/INDICADOR-PRECIOS/pulso.html una vez subida.":"No se pudo conectar con Binance ni con Crypto.com. Conecta Crypto.com en claude.ai → Ajustes → Conectores.");}

/* ======================= carga ======================= */
async function loadIntraday(){
  stop();const g=gen;firstFit=true;candles=[];F=null;
  octx.clearRect(0,0,ov.width,ov.height);$("empty").hidden=false;$("empty").textContent="Cargando velas…";setSrc("","Conectando…");
  if(extOk!==false&&(SY().bn||SY().hl)){try{SY().hl?await hlIntraday(g):await binanceIntraday(g);extOk=true;return;}catch(e){if(g!==gen)return;if(extOk!==true)extOk=false;else{setSrc("off","Sin datos de "+SY().id);}}}
  await cdcIntraday(g);cdcDaily(g);
}
function loadAll(){daily=[];if(st.view==="ind")renderInd();loadIntraday();}

$("mktSym").textContent=st.sym;drawTfs();applyMode();setView(st.view);loadAll();
}
})();
